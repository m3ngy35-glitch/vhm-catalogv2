<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VHM Host Screen</title>
<!--
  VHM host screen.
  v1.14 "quiet edit": the screen always shows the clean read view, and editing is always on.
    · Tap a price or KG cell to type (Enter saves, Esc undoes).
    · Tap a card (or its ⋯) to open its tools: label, fit, item type, note, Use Vrich stock, remove.
      The tools close on ✓ Done, a tap outside the card, or after 20 s untouched.
    · ⚙ in the top bar opens the overlay look, giveaway, size guides and the colour key.
  ?view=1  read only (no editing at all)    ?demo=1 sample data (edits stay on this page)    ?theme=light|dark
  Writes only kv/live_overlay_* and kv/live_log:* documents, same as v1.13.
  v1.15: · 📌 Our note under each code: typed straight on the card, only on this host screen (never on stream).
           Saved per code in kv/live_host_notes, so it comes back the next time that code is on stream.
         · In-hand cards (អាវលើដៃ / ខោលើដៃ): the label is typed straight on the card — pick or type, no pop-up.
           The label box in the card tools works the same way (no pop-up) for every card.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#121513; --card:#1E2320; --text:#FFFFFF; --sub:#B3BAB5; --ok:#2E3A33; --lowBg:#4A3A1A; --lowText:#FFC94D;
    --outBg:#262A27; --outText:#6F7672; --wBg:#26303F; --warnBg:#4A3A12; --warnText:#FFD98A; --bad:#E5484D;
    --field:#121513; --line:#3A413C; --btn:#2E3A33; --save:#1D6E52;
    --promo:#F4A6C0; --shirt:#7FB2FF; --pants:#5FD39A; --hand:#FFC94D; --hand2:#C9A6F4;
  }
  body.light {
    --bg:#E9ECE9; --card:#FFFFFF; --text:#141714; --sub:#545C57; --ok:#E2EFE6; --lowBg:#FFE3A3; --lowText:#6B4300;
    --outBg:#EEF0EE; --outText:#8E9590; --wBg:#E6ECF7; --warnBg:#FFF1CC; --warnText:#6B4300; --bad:#C2312F;
    --field:#F6F7F5; --line:#CFD4D0; --btn:#E2EFE6; --save:#1D6E52;
    --promo:#B0466B; --shirt:#2A64C9; --pants:#1E7A4C; --hand:#9A5F00; --hand2:#6B46B0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: 'Kantumruy Pro', system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px; gap: 14px; min-height: 100vh; }
  button { font-family: inherit; }
  .bar { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--card); border-radius: 12px; font-size: 18px; flex-wrap: wrap; }
  .bar .dot { width: 12px; height: 12px; border-radius: 6px; background: var(--pants); display: inline-block; margin-right: 8px; }
  .bar.off .dot { background: var(--bad); }
  .bar .sub { color: var(--sub); font-size: 16px; }
  .bar .sp { margin-left: auto; }
  .tbtn { font-weight: 600; font-size: 15px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--sub); background: transparent; color: var(--text); cursor: pointer; min-height: 40px; }
  .tbtn.on { background: var(--save); border-color: var(--save); color: #fff; }
  #look { display: none; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; background: var(--card); border-radius: 12px; font-size: 16px; }
  body.look #look { display: flex; }
  body.locked #lookBtn { display: none; }
  #look .grp { display: flex; align-items: center; gap: 6px; margin-right: 14px; }
  #look b { min-width: 40px; text-align: center; }
  .sm { min-width: 40px; min-height: 40px; border-radius: 8px; border: 0; background: var(--btn); color: var(--text); font-weight: 700; font-size: 18px; cursor: pointer; }
  #grid { display: grid; gap: 14px; flex: 1; align-items: start; }
  .empty { display: flex; align-items: center; justify-content: center; min-height: 240px; color: var(--sub); font-size: 22px; background: var(--card); border-radius: 14px; text-align: center; padding: 20px; }
  .card { background: var(--card); border-radius: 14px; border-top: 8px solid var(--accent); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .slot { font-size: 17px; font-weight: 700; letter-spacing: .05em; color: var(--accent); }
  .age { font-size: 15px; color: var(--sub); }
  .age.old { color: var(--lowText); font-weight: 700; }
  .hand-tag { font-size: 14px; font-weight: 700; color: var(--warnText); background: var(--warnBg); padding: 2px 8px; border-radius: 999px; }
  .codeRow { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .code { font-family: 'Space Grotesk', sans-serif; font-size: clamp(40px, 5vw, 68px); font-weight: 700; line-height: 1; }
  .price { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; color: var(--accent); }
  .meta { font-size: 18px; color: var(--sub); }
  .fit { display: inline-block; padding: 1px 10px; border-radius: 999px; background: var(--accent); color: #141714; font-weight: 700; font-size: 16px; margin-left: 6px; }
  .warn { background: var(--warnBg); color: var(--warnText); border-radius: 8px; padding: 6px 10px; font-size: 16px; font-weight: 600; }
  .tbl { display: grid; gap: 6px; align-items: center; text-align: center; }
  .tbl .h { font-size: 15px; font-weight: 700; color: var(--sub); line-height: 1.15; overflow-wrap: anywhere; }
  .tbl .sz { text-align: left; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; }
  .tbl .kg { padding: 8px 0; background: var(--wBg); border-radius: 8px; font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 700; white-space: nowrap; }
  .tbl .kg.none { color: var(--warnText); background: var(--warnBg); font-size: 15px; }
  .tbl .n { padding: 8px 0; border-radius: 8px; font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; background: var(--ok); }
  .tbl .n.low { background: var(--lowBg); color: var(--lowText); }
  .tbl .n.out { background: var(--outBg); color: var(--outText); font-weight: 500; text-decoration: line-through; }
  .tbl .n.na { background: transparent; color: var(--outText); font-weight: 500; }
  .promoLines div { font-size: 22px; font-weight: 700; line-height: 1.5; }
  .promoTitle { font-size: 30px; font-weight: 700; }
  /* editor */
  .ed { border-top: 2px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .ed h3 { margin: 0; font-size: 16px; color: var(--accent); letter-spacing: .04em; }
  .ed label { display: flex; flex-direction: column; gap: 3px; font-size: 14px; color: var(--sub); font-weight: 600; }
  .ed .row2 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .ed input, .ed textarea { font: 600 17px 'Kantumruy Pro', system-ui, sans-serif; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  .ed textarea { min-height: 110px; line-height: 1.5; resize: vertical; }
  .ed .hint { font-size: 13px; color: var(--sub); font-weight: 400; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { min-height: 36px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--text); font-size: 15px; cursor: pointer; }
  .chip.on { background: var(--save); border-color: var(--save); color: #fff; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .act { min-height: 42px; padding: 8px 14px; border-radius: 8px; border: 0; font-weight: 700; font-size: 15px; cursor: pointer; background: var(--btn); color: var(--text); }
  .act.save { background: var(--save); color: #fff; }
  .act.danger { background: transparent; border: 1px solid var(--bad); color: var(--bad); }
  .msg { font-size: 14px; color: var(--sub); min-height: 18px; }
  .xbtn { min-width: 34px; min-height: 34px; border-radius: 8px; border: 1px solid var(--bad); background: transparent; color: var(--bad); font-weight: 700; cursor: pointer; }
  .pwrap { display: inline-flex; align-items: baseline; gap: 2px; }
  /* quiet edit: editable cells look like the read view, with a dotted underline as the only hint */
  .pin { width: 4.4em; font: 700 26px 'Space Grotesk', sans-serif; color: var(--accent); background: transparent; border: 0; border-bottom: 2px dotted var(--line); border-radius: 0; padding: 0 2px; }
  .pin:focus { background: var(--field); border-radius: 6px; }
  .pick { font: 700 17px 'Kantumruy Pro', system-ui, sans-serif; color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin-right: 8px; min-height: 40px; }
  .meta .act { min-height: 40px; }
  .kgin { width: 100%; box-sizing: border-box; text-align: center; padding: 8px 2px; border-radius: 8px; border: 0; border-bottom: 2px dotted var(--line); background: var(--wBg); color: var(--text); font: 700 21px 'Space Grotesk', sans-serif; }
  .card.open { box-shadow: 0 0 0 2px var(--accent); }
  .tools { min-width: 40px; min-height: 36px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--sub); font-weight: 700; font-size: 18px; cursor: pointer; line-height: 1; }
  .card.open .tools { background: var(--accent); border-color: var(--accent); color: #141714; }
  .ed .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ed .row .pick { margin-right: 0; }
  .soldout { font-size: 15px; color: var(--outText); }
  .top .sp { margin-left: auto; }
  #look .legend { flex-basis: 100%; font-size: 14px; }
  .kgin.none { background: var(--warnBg); color: var(--warnText); }
  .kgin:focus, .pin:focus { outline: 2px solid var(--accent); border-style: solid; }
  .saving { opacity: .6; } .saved { outline: 2px solid var(--pants) !important; } .failed { outline: 2px solid var(--bad) !important; }
  .kg.guide { color: var(--sub); font-style: italic; }
  .kgin::placeholder { color: var(--sub); font-style: italic; opacity: .8; }
  .gh { margin: 6px 0 0; font-size: 16px; color: var(--sub); }
  .notel { display: flex; flex-direction: column; gap: 3px; font-size: 14px; color: var(--sub); font-weight: 600; }
  .notein { font: 600 17px 'Kantumruy Pro', system-ui, sans-serif; color: var(--text); background: var(--field); border: 1px dashed var(--line); border-radius: 8px; padding: 7px 10px; }
  .notev { font-size: 17px; font-weight: 600; color: var(--sub); }
  .hnote { width: 100%; font: 600 18px 'Kantumruy Pro', system-ui, sans-serif; color: var(--warnText); background: transparent; border: 0; border-bottom: 2px dotted var(--line); padding: 4px 2px; }
  .hnote:focus { background: var(--field); border-radius: 6px; }
  .hnote::placeholder { color: var(--sub); font-weight: 400; opacity: .8; }
  .hnotev { font-size: 18px; font-weight: 600; color: var(--warnText); }
  .lblin { font: 600 18px 'Kantumruy Pro', system-ui, sans-serif; color: var(--sub); background: transparent; border: 0; border-bottom: 2px dotted var(--line); padding: 2px 2px; width: 9em; }
  .lblin:focus { background: var(--field); border-radius: 6px; color: var(--text); }
  .ed .lblin { background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-height: 40px; color: var(--text); }
  .legend { display: flex; gap: 22px; font-size: 16px; color: var(--sub); flex-wrap: wrap; }
  .legend b { color: var(--text); } .legend .l { color: var(--lowText); }
</style>
</head>
<body>
<div class="bar" id="bar">
  <span><span class="dot"></span><b id="conn">Connecting…</b></span>
  <span class="sub" id="note">Stock changes only when an admin sends it from Vrich</span>
  <span class="sp"></span>
  <button type="button" class="tbtn" id="lookBtn">⚙ Look &amp; giveaway</button>
  <button type="button" class="tbtn" id="theme">☀ Light</button>
</div>
<div id="look">
  <b style="min-width:auto">Overlay look:</b>
  <span class="grp">Text size <button class="sm" data-k="textSize" data-d="-1">−</button><b id="v_textSize">20</b><button class="sm" data-k="textSize" data-d="1">+</button></span>
  <span class="grp">Smallest <button class="sm" data-k="minText" data-d="-1">−</button><b id="v_minText">12</b><button class="sm" data-k="minText" data-d="1">+</button></span>
  <span class="grp">Width <button class="sm" data-k="width" data-d="-1">−</button><b id="v_width">2/6</b><button class="sm" data-k="width" data-d="1">+</button></span>
  <button class="tbtn" id="modeBtn">🃏 Cards</button>
  <button class="tbtn" id="styleBtn">◼ Style: Solid</button>
  <button class="tbtn" id="popsBtn">📣 Thank-you pop-ups: On</button>
  <button class="tbtn" id="giveBtn">🎁 Giveaway</button>
  <button class="tbtn" id="guideBtn">📏 Size guides</button>
  <button class="tbtn" id="lookClose">▴ Close</button>
  <div class="legend"><span><b>5</b> pieces left</span><span class="l"><b style="color:inherit">2</b> only 1–2 left</span><span><s>0</s> sold out in that colour</span><span>— size not in this colour</span><span>✋ sizes typed by hand (🔄 Refresh won't overwrite them)</span><span>Dotted line = tap to type · tap a card for its tools</span></div>
</div>
<div id="grid"></div>
<datalist id="stdLabels"><option value="អាវលើខ្លួន"><option value="ខោលើខ្លួន"><option value="អាវលើដៃ"><option value="ខោលើដៃ"></datalist>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
(function () {
  var ORDER = ['XS','S','M','L','XL','2XL','3XL','4XL','5XL'];
  var FITS = ['រាងស្លុីម', 'រាងធម្មតា', 'រាងរលុង'];
  var SLOTS = [
    { id: 'shirt', name: 'អាវលើខ្លួន · SHIRT', label: 'អាវលើខ្លួន' },
    { id: 'pants', name: 'ខោលើខ្លួន · PANTS', label: 'ខោលើខ្លួន' },
    { id: 'hand',  name: 'លើដៃ · IN HAND', label: 'លើដៃ' },
    { id: 'hand2', name: 'លើដៃ ២ · IN HAND 2', label: 'លើដៃ' }
  ];
  var params = new URLSearchParams(location.search);
  var demo = params.get('demo') === '1';
  var state = { guides: {}, slots: {}, entries: {}, hostNotes: {}, settings: { textSize: 20, minText: 12, width: 2, mode: 'cards', pops: true, style: 'solid' } };
  var drafts = {};
  var grid = document.getElementById('grid');

  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  /* v1.14 quiet edit: editing is always on (unless ?view=1); tools open per card only when tapped */
  var theme = params.get('theme') || load('vhm_host_theme') || 'dark';
  var editing = params.get('view') !== '1';
  store('vhm_host_edit', null);  /* old v1.13 setting, no longer used */
  var lookOpen = false;          /* ⚙ panel: always starts closed so the live screen starts clean */
  var promoOpen = false, guidesOpen = false;
  var openCard = null;           /* 'slot:CODE' whose tools are open, or 'promo' */
  var lastTouch = 0, IDLE_MS = 20000;
  var themeBtn = document.getElementById('theme'), lookBtn = document.getElementById('lookBtn');
  function applyChrome() {
    document.body.classList.toggle('light', theme === 'light');
    document.body.classList.toggle('locked', !editing);
    document.body.classList.toggle('look', editing && lookOpen);
    themeBtn.textContent = theme === 'light' ? '☾ Dark' : '☀ Light';
    lookBtn.classList.toggle('on', lookOpen);
  }
  themeBtn.onclick = function () { theme = theme === 'light' ? 'dark' : 'light'; store('vhm_host_theme', theme); applyChrome(); };
  function setLook(on) {
    lookOpen = on;
    if (!on) { promoOpen = false; guidesOpen = false; drafts = {}; }
    applyChrome(); render();
  }
  lookBtn.onclick = function () { setLook(!lookOpen); };
  document.getElementById('lookClose').onclick = function () { setLook(false); };
  applyChrome();

  function setOpen(key) { openCard = key; lastTouch = Date.now(); render(); }
  /* tap outside the open card closes its tools */
  document.addEventListener('pointerdown', function (e) {
    if (!openCard) return;
    var c = e.target.closest && e.target.closest('.card');
    if (c && c.dataset.key === openCard) { lastTouch = Date.now(); return; }
    if (c && c.dataset.key) return;  /* tapping another card: its own click handler switches */
    if (e.target.closest && e.target.closest('#look, #lookBtn')) return;
    openCard = null; requestRender();
  }, true);
  document.addEventListener('keydown', function () { if (openCard) lastTouch = Date.now(); }, true);
  setInterval(function () {
    if (openCard && openCard !== 'promo' && Date.now() - lastTouch > IDLE_MS && !busyTyping()) { openCard = null; render(); }
  }, 2000);

  function sizeKey(s) { var i = ORDER.indexOf(s); if (i >= 0) return i; var n = parseFloat(s); return isNaN(n) ? 999 : 100 + n; }
  function money(p) { p = String(p || '').trim(); if (!p) return ''; return /\$/.test(p) ? p : p + '$'; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function ago(iso) {
    if (!iso) return { t: '', old: false };
    var m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
    return { t: m < 1 ? 'stock just now' : 'stock ' + m + ' min ago', old: m >= 10 };
  }

  /* ---------- what customers see (same rules as overlay.html) ---------- */
  /* ---------- kinds: shirt & pants show weights, belts show length in cm, glasses/masks show colours only ----------
     Each code's kind is set on the host screen (Live Log "kind"); if not set it is guessed from the Vrich type word and sizes. */
  var KINDS = {
    shirt:   { t: 'អាវ · S–4XL',        kg: true },
    pants:   { t: 'ខោ · ចង្កេះ',          kg: true, optional: true },  /* waist sizes: weight only if that code has its own; never a guide or a warning */
    belt:    { t: 'ខ្សែក្រវ៉ាត់ · cm',   kg: false, unit: 'cm' },
    glasses: { t: 'វ៉ែនតា · no size',     kg: false, nosize: true },
    mask:    { t: 'ម៉ាស់ · no size',      kg: false, nosize: true },
    other:   { t: 'Other · no size',      kg: false, nosize: true }
  };
  function guessKind(d, entry) {
    if (entry && KINDS[entry.kind]) return entry.kind;
    var t = [(entry && entry.garmentType) || '', (d && d.type) || '', (d && d.label) || ''].join(' ');
    if (/ខ្សែក្រវ៉ាត់|ខ្សែ|belt/i.test(t)) return 'belt';
    if (/វ៉ែនតា|glass/i.test(t)) return 'glasses';
    if (/ម៉ាស់|mask/i.test(t)) return 'mask';
    var zs = [];
    ((d && d.colors) || []).forEach(function (c) { (c.sizes || []).forEach(function (s) { zs.push(String(s.z || '')); }); });
    var real = zs.filter(function (z) { return z && z !== '—' && !/^(F|FREE|FS|OS)$/i.test(z); });
    if (zs.length && !real.length) return 'other';
    if (real.length && real.every(function (z) { return /^\d+(\.\d)?(CM)?$/i.test(z); })) {
      return Math.max.apply(null, real.map(parseFloat)) >= 60 ? 'belt' : 'pants';
    }
    if (/ខោ/.test(t)) return 'pants';
    return 'shirt';
  }
  var KIND_LABEL = { belt: 'ខ្សែក្រវ៉ាត់', glasses: 'វ៉ែនតា', mask: 'ម៉ាស់' };
  function cardLabel(slotId, d, entry) {
    if (d && d.label) return d.label;
    var gt = String((entry && entry.garmentType) || '').trim(), k = guessKind(d, entry);
    if (KIND_LABEL[k]) return gt && !/^(អាវ|ខោ)លើ/.test(gt) ? gt : KIND_LABEL[k];
    return defaultLabel(slotId, entry);
  }
  function showSize(z, kind) { return kind === 'belt' && /^\d+(\.\d)?$/.test(z) ? z + 'cm' : String(z).replace(/CM$/i, 'cm'); }

  var STD_LABELS = ['អាវលើខ្លួន', 'ខោលើខ្លួន', 'អាវលើដៃ', 'ខោលើដៃ'];
  /* label shown on a card: typed on the card > based on the slot (worn / in hand) and the garment kind in Live Log */
  function defaultLabel(slotId, entry) {
    var gt = String((entry && entry.garmentType) || '').trim();
    if (gt && STD_LABELS.indexOf(gt) < 0) return gt;
    var pants = /ខោ/.test(gt);
    if (slotId === 'shirt') return 'អាវលើខ្លួន';
    if (slotId === 'pants') return 'ខោលើខ្លួន';
    return pants ? 'ខោលើដៃ' : 'អាវលើដៃ';
  }
  function vrichColors(d) {
    return (d.colors || []).map(function (c) {
      var z = (c.sizes || []).filter(function (x) { return x.remain > 0; }).sort(function (a, b) { return sizeKey(a.z) - sizeKey(b.z); })
        .map(function (x) { return (x.remain <= 2 ? '!' : '') + x.z; });
      return { c: /^(អាវ|ខោ|ឈុត|ស្បែកជើង|មួក)/.test(c.c || '') ? '' : (c.c || ''), sizes: z };
    }).filter(function (c) { return c.sizes.length; });
  }
  function derived(slot) {

    document.getElementById('v_textSize').textContent = st.textSize;
    document.getElementById('v_minText').textContent = st.minText;
    document.getElementById('v_width').textContent = st.width + '/6';
    document.getElementById('modeBtn').textContent = st.mode === 'text' ? '🅰 Text mode (safe) — tap for Cards' : '🃏 Cards — tap for safe Text mode';
    var STYLE_NAME = { solid: '◼ Solid', smoked: 'A Smoked Glass', champagne: 'B Champagne Stone', espresso: 'C Ambient Espresso', titanium: 'D Frosted Titanium', glass: '💎 Glass', frost: '❄️ Frost' };
    document.getElementById('styleBtn').textContent = 'Style: ' + (STYLE_NAME[st.style] || STYLE_NAME.solid) + ' — tap to change';
    var pb = document.getElementById('popsBtn');
    pb.textContent = st.pops === false ? '📣 Thank-you pop-ups: Off — tap to turn on' : '📣 Thank-you pop-ups: On — tap to turn off';
    pb.classList.toggle('on', st.pops !== false);

    var filled = SLOTS.filter(function (s) { var d = state.slots[s.id]; return d && d.code; });
    var promo = state.slots.promo;
    var gb = document.getElementById('giveBtn');
    gb.textContent = (promoOpen ? '🎁 Giveaway editor: open' : '🎁 Giveaway') + (promo && promo.show ? ' · on stream' : '');
    gb.classList.toggle('on', !!(promo && promo.show));
    var showPromo = (editing && promoOpen) || !!(promo && promo.show);
    document.getElementById('guideBtn').textContent = guidesOpen ? '📏 Size guides: open' : '📏 Size guides';
    grid.innerHTML = '';
    var cols = [];
    if (editing && guidesOpen) { grid.appendChild(guidesCard()); cols.push(2); }
    if (showPromo) { grid.appendChild(promoCard()); cols.push(editing && promoOpen ? 3 : 2); }
    filled.forEach(function (s) { var r = productCard(s); grid.appendChild(r.card); cols.push(r.weight); });
    if (!filled.length) {
      grid.appendChild(el('div', 'empty', 'No product on stream yet — admin sends a code from Vrich (📺 VHM Overlay)'));
      cols.push(3);
    }
    grid.style.gridTemplateColumns = cols.map(function (n) { return 'minmax(0, ' + n + 'fr)'; }).join(' ');
  }
  setInterval(requestRender, 30000); /* keep the "stock X min ago" labels fresh */

  /* overlay look controls (edit mode) */
  document.querySelectorAll('#look .sm').forEach(function (b) {
    b.onclick = function () {
      var k = b.dataset.k, d = Number(b.dataset.d), st = state.settings, v = Number(st[k]) + d;
      if (k === 'textSize') v = Math.max(12, Math.min(30, v));
      if (k === 'minText') v = Math.max(8, Math.min(Number(st.textSize), v));
      if (k === 'width') v = Math.max(1, Math.min(3, v));
      var next = JSON.parse(JSON.stringify(st)); next[k] = v; writeSettings(next);
    };
  });
  document.getElementById('guideBtn').onclick = function () { guidesOpen = !guidesOpen; render(); };
  document.getElementById('giveBtn').onclick = function () { promoOpen = !promoOpen; if (!promoOpen) delete drafts.promo; render(); };
  document.getElementById('styleBtn').onclick = function () {
    var order = ['solid', 'smoked', 'champagne', 'espresso', 'titanium', 'glass', 'frost'], next = JSON.parse(JSON.stringify(state.settings));
    next.style = order[(order.indexOf(next.style || 'solid') + 1) % order.length]; writeSettings(next);
  };
  document.getElementById('popsBtn').onclick = function () {
    var next = JSON.parse(JSON.stringify(state.settings)); next.pops = next.pops === false; writeSettings(next);
  };
  document.getElementById('modeBtn').onclick = function () {
    var next = JSON.parse(JSON.stringify(state.settings)); next.mode = next.mode === 'text' ? 'cards' : 'text'; writeSettings(next);
  };
  function writeSettings(next) {
    if (demo) { state.settings = next; render(); return; }
    kvc.doc('live_overlay_settings').set({ data: JSON.stringify(next), updatedAt: new Date() }).catch(function (e) { alert('Could not save: ' + e.message); });
  }

  var conn = document.getElementById('conn'), bar = document.getElementById('bar');
  function setConn(ok, text) { bar.classList.toggle('off', !ok); conn.textContent = text; }

  if (demo) {
    var t = Date.now();
    function st(list) { return list.map(function (s) { var p = s.split(':'); return { c: p[0], sizes: p[1].split(' ').map(function (x) { var q = x.split('='); return { z: q[0], remain: Number(q[1]) }; }) }; }); }
    state.slots = {
      promo: { type: 'promo', show: true, title: 'ថ្ងៃនេះ Giveaway!', lines: ['ទាយលេខ ២ ខ្ទង់ (00–99)', 'រង្វាន់: E369 ១ ដើម'] },
      shirt: { code: 'E369', price: '6.60', at: new Date(t - 12 * 60000).toISOString(), colors: st(['ខ្មៅ:L=4 XL=5 2XL=0 3XL=3 4XL=2', 'សាច់:L=3 XL=4 2XL=5 3XL=3 4XL=0', 'កាហ្វេ:L=5 XL=4 2XL=3 3XL=1 4XL=4']) },
      hand: { code: 'E136', price: '6.40', at: new Date(t).toISOString(), colors: st(['ប្រផេះ:XL=3', 'ដី:XL=2', 'មេឃ:L=4 XL=0', 'ខៀវ:L=3 XL=4']) }
    };
    state.entries = {
      E369: { garmentType: 'អាវលើខ្លួន', fit: 'រាងស្លុីម', price: '6.60', weights: { L: '50-60', XL: '60-70', '2XL': '70-80', '3XL': '80-85', '4XL': '85-90' } },
      E136: { garmentType: 'អាវលើដៃ', fit: 'រាងរលុង', price: '6.40', weights: { L: '60-70' } }
    };
    state.hostNotes = { E369: 'ពណ៌កាហ្វេ ថ្មីមកដល់ · និយាយពីក្រណាត់ត្រជាក់' };
    setConn(true, 'Demo data — edits stay on this page'); render(); return;
  }

  firebase.initializeApp({
    apiKey: 'AIzaSyDDQp5_gvuRdX0flKQ3gm3zXJM_SXWUJSE', authDomain: 'vhm-catalog.firebaseapp.com', projectId: 'vhm-catalog',
    storageBucket: 'vhm-catalog.firebasestorage.app', messagingSenderId: '892196724857', appId: '1:892196724857:web:8ed3f5f056284b63aa34a8'
  });
  kvc = firebase.firestore().collection('kv');
  function parseData(snap) {
    if (!snap.exists) return null; var v = snap.data().data;
    if (v == null || v === '') return null;
    if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return null; } }
    return v;
  }
  function onMeta(snap) {
    var cached = snap.metadata && snap.metadata.fromCache;
    if (!navigator.onLine || cached) setConn(false, 'Offline — showing the last stock received');
    else setConn(true, 'Connected');
  }
  window.addEventListener('offline', function () { setConn(false, 'Offline — showing the last stock received'); });
  window.addEventListener('online', function () { setConn(true, 'Connected'); });

  var entryUnsubs = {};
  function syncEntries() {
    var want = {};
    SLOTS.forEach(function (s) { var d = state.slots[s.id]; if (d && d.code) want[String(d.code).toUpperCase()] = 1; });
    Object.keys(entryUnsubs).forEach(function (c) { if (!want[c]) { entryUnsubs[c](); delete entryUnsubs[c]; delete state.entries[c]; } });
    Object.keys(want).forEach(function (c) {
      if (entryUnsubs[c]) return;
      entryUnsubs[c] = kvc.doc('live_log:' + c.replace(/\//g, '-')).onSnapshot(function (snap) { state.entries[c] = parseData(snap); requestRender(); },
        function () { setConn(false, 'Could not read Live Log — showing the last data'); });
    });
  }
  ['promo'].concat(SLOTS.map(function (s) { return s.id; })).forEach(function (id) {
    kvc.doc('live_overlay_' + id).onSnapshot({ includeMetadataChanges: true }, function (snap) {
      onMeta(snap);
      var prev = state.slots[id], before = JSON.stringify(prev || null);
      state.slots[id] = parseData(snap);
      var now = state.slots[id];
      if (JSON.stringify(now || null) !== before && drafts[id] && !drafts[id].dirty) delete drafts[id];
      syncEntries();
      /* a new code sent from Vrich always shows straight away, even while someone is typing elsewhere */
      if ((prev && prev.code) !== (now && now.code)) render(); else requestRender();
    }, function () { setConn(false, 'Connection problem — showing the last stock received'); });
  });
  /* Is Live Log recording this live for VHM Inventory? (Start live writes kv/live_overlay_session, End live clears it) */
  var rec = { session: null, shown: 0 };
  function showRec() {
    var note = document.getElementById('note');
    var onStream = SLOTS.some(function (s) { var d = state.slots[s.id]; return d && d.code; });
    if (rec.session && rec.session.startedAt) {
      var t = new Date(rec.session.startedAt);
      note.textContent = '⏺ Live Log recording since ' + String(t.getHours()).padStart(2, '0') + ':' + String(t.getMinutes()).padStart(2, '0') + ' · ' + rec.shown + ' codes sent to stream — press End live in Live Log after the live';
      note.style.color = '';
    } else if (onStream) {
      note.textContent = '⚠ Live Log not started — press ⏺ Start live in Live Log, then End live after, so VHM Inventory gets the codes (' + rec.shown + ' waiting)';
      note.style.color = 'var(--warnText)';
    } else { note.textContent = 'Stock changes only when an admin sends it from Vrich'; note.style.color = ''; }
  }
  kvc.doc('live_overlay_session').onSnapshot(function (snap) { rec.session = snap.exists ? parseData(snap) : null; showRec(); }, function () {});
  kvc.doc('live_overlay_shown').onSnapshot(function (snap) { var c = snap.exists && snap.data().codes; rec.shown = c && typeof c === 'object' ? Object.keys(c).length : 0; showRec(); }, function () {});
  setInterval(showRec, 30000);
  kvc.doc('live_host_notes').onSnapshot(function (snap) { state.hostNotes = parseData(snap) || {}; requestRender(); }, function () {});
  kvc.doc('live_overlay_guides').onSnapshot(function (snap) { state.guides = parseData(snap) || {}; requestRender(); }, function () {});
  kvc.doc('live_overlay_settings').onSnapshot(function (snap) {
    var d = parseData(snap) || {};
    ['textSize', 'minText', 'width', 'mode', 'pops', 'style'].forEach(function (k) { if (d[k] != null) state.settings[k] = d[k]; });
    requestRender();
  }, function () {});
})();
</script>
</body>
