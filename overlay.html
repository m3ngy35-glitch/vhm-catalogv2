<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VHM Stream Overlay</title>
<!--
  VHM stream overlay — OBS Browser Source (1080 x 1920, transparent).
  Data:  kv/live_overlay_{shirt|pants|hand|hand2}  ← written by the "Send to overlay" bookmarklet on Vrich
         kv/live_overlay_settings                   ← text size / width / Cards-or-Text from the same panel
         kv/live_log:{CODE}                         ← price, fit, garment label and weights from Live Log
  Options in the link:
    ?slot=shirt|pants|hand|hand2   show only that one card (place it yourself in OBS)
    ?demo=1                        sample cards, no database (for setting up OBS)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Khmer:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 540px; height: 960px; transform-origin: 0 0;
           font-family: Roboto, 'Noto Sans Khmer', -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #fff; }
  #col { position: absolute; top: 134px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .card { box-sizing: border-box; padding: 0.55em 0.75em 0.6em 0.7em; background: rgba(14,16,15,0.82);
          border-left: 3px solid var(--accent); border-radius: 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.22); }
  .inner { width: max-content; display: flex; flex-direction: column; gap: 0.35em; }
  .head { display: flex; flex-wrap: wrap; row-gap: 0.15em; justify-content: space-between; align-items: center; gap: 0.6em; }
  .label { font-size: 0.86em; font-weight: 700; color: #E1E4E1; white-space: nowrap; }
  .fit { padding: 0 0.55em; background: var(--accent); color: #171510; border-radius: 999px; font-size: 0.86em; font-weight: 700; white-space: nowrap; }
  .codeRow { display: flex; align-items: baseline; justify-content: space-between; gap: 0.8em; }
  .code { font-size: 1.35em; font-weight: 700; line-height: 1; }
  .price { font-size: 1.05em; font-weight: 700; color: var(--accent); }
  .promoTitle { line-height: 1.2; }
  .card[data-promo] { max-width: 100%; }
  .card[data-promo] .inner { width: auto; max-width: 100%; }
  .card[data-promo] .line, .card[data-promo] .promoTitle { white-space: normal; overflow-wrap: anywhere; }
  .line { white-space: nowrap; font-weight: 700; line-height: 1.5; }
  .line .c { margin-right: 0.55em; white-space: nowrap; word-break: keep-all; }
  .line .z { margin-right: 0.5em; }
  .line .low { color: var(--low); }
  .line .dim, .line.dim { color: #C9CEC9; font-weight: 500; }
  .line.small { font-size: 0.86em; line-height: 1.3; }
  .weights { display: flex; flex-direction: column; padding-top: 0.3em; border-top: 1px solid rgba(255,255,255,0.14); }
  .w { white-space: nowrap; font-weight: 700; line-height: 1.5; }
  .w .s { display: inline-block; min-width: 2.6em; }
  .w .k { color: var(--accent); }
  .note { font-size: 0.86em; font-weight: 700; color: #E1E4E1; white-space: normal; max-width: 13em; line-height: 1.35; padding-top: 0.25em; border-top: 1px solid rgba(255,255,255,0.14); }
  /* "Liquid glass" looks: rounded glass panel, thin bright rim, soft light sheen on top.
     OBS can't blur the camera behind a Browser Source, so the glass is tinted, not truly frosted.
     glass = smoked glass (best on white walls)   frost = milky light glass (like the weather widgets) */
  .glass .card, .frost .card { position: relative; overflow: hidden; border-radius: 18px; border: 1.5px solid rgba(255,255,255,0.55); }
  .glass .card { background: linear-gradient(165deg, rgba(255,255,255,0.22) 0%, rgba(40,42,41,0.50) 34%, rgba(14,16,15,0.66) 100%);
                 box-shadow: inset 0 1px 0 rgba(255,255,255,0.75), inset 0 0 12px rgba(255,255,255,0.10), 0 10px 26px rgba(0,0,0,0.30); }
  .frost .card { background: linear-gradient(165deg, rgba(255,255,255,0.34) 0%, rgba(150,154,152,0.40) 38%, rgba(58,62,60,0.52) 100%);
                 box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), inset 0 0 16px rgba(255,255,255,0.22), 0 10px 26px rgba(0,0,0,0.22); }
  .glass .card::before, .frost .card::before { content: ''; position: absolute; left: -30%; top: -55%; width: 160%; height: 85%; pointer-events: none; filter: blur(6px);
                         background: radial-gradient(ellipse at 50% 100%, rgba(255,255,255,0.20), rgba(255,255,255,0) 62%); }
  .glass .card > .inner, .frost .card > .inner { position: relative; }
  .glass .card * { text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
  .frost .card * { text-shadow: 0 1px 2px rgba(0,0,0,0.55), 0 0 6px rgba(0,0,0,0.45), 0 0 14px rgba(0,0,0,0.25); }
  .glass .fit, .frost .fit { background: rgba(255,255,255,0.88); color: #171510; text-shadow: none; }
  .glass .label, .frost .label, .frost .line .dim, .frost .line.dim { color: #fff; }
  .frost .price, .frost .w .k { color: #FFE7A3; }
  .glass .weights, .glass .note, .frost .weights, .frost .note { border-top-color: rgba(255,255,255,0.35); }
  /* ===== V11 material looks: smoked / champagne / espresso / titanium (same layout, surface only) ===== */
  .lux .card { position: relative; overflow: hidden; border: 0; border-radius: 4px; --hair: rgba(255,240,220,0.13); }
  .lux .card::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: var(--light); }
  .lux .card::after { content: ''; position: absolute; inset: 0; pointer-events: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); background-size: 160px 160px; opacity: var(--grain); mix-blend-mode: var(--blend); }
  .lux .card > .inner { position: relative; z-index: 1; }
  .lux .fit { background: transparent; border: 1px solid var(--fitEdge); color: var(--fitC); font-weight: 500; line-height: 1.45; }
  .lux .label { font-weight: 500; letter-spacing: 0.02em; }
  .lux .code { letter-spacing: 0.04em; } .lux .promoTitle { letter-spacing: 0; }
  .lux .weights, .lux .note { border-top-color: var(--hair); }
  .lux .w .k { color: var(--kg); } .lux .line .low { color: var(--lowC); }
  .lux .price { color: inherit; }
  .lux .label, .lux .note, .lux .line .dim, .lux .line.dim { color: var(--soft); }
  .s-smoked .card { color: #F4F0E9; --soft: #CEC5B7; --fitC: #E5D3B0; --fitEdge: rgba(229,211,176,0.55); --kg: #E3CFA6; --lowC: #E89A6C; --grain: 0.10; --blend: overlay;
    text-shadow: 0 1px 1px rgba(0,0,0,0.25);
    --light: linear-gradient(115deg, rgba(255,240,215,0.07), rgba(255,240,215,0) 45%);
    background: radial-gradient(130% 90% at 0% 0%, rgba(150,130,108,0.34), rgba(150,130,108,0) 58%), radial-gradient(90% 80% at 100% 100%, rgba(74,64,55,0.45), rgba(74,64,55,0) 65%), radial-gradient(70% 50% at 85% 10%, rgba(120,112,104,0.18), rgba(120,112,104,0) 70%), linear-gradient(168deg, rgba(40,37,34,0.76), rgba(22,21,20,0.84));
    box-shadow: inset 0 0 0 1px rgba(255,240,220,0.11), inset 0 1px 0 rgba(255,245,230,0.16), 0 12px 30px rgba(24,18,12,0.20), 0 2px 6px rgba(24,18,12,0.14); }
  .s-champagne .card { color: #1E1B17; --soft: #675D51; --fitC: #5E4E3B; --fitEdge: rgba(94,78,59,0.45); --kg: #75572F; --lowC: #A9502A; --hair: rgba(60,48,36,0.13); --grain: 0.14; --blend: multiply;
    --light: linear-gradient(115deg, rgba(255,255,255,0.18), rgba(255,255,255,0) 50%);
    background: radial-gradient(130% 85% at 0% 0%, rgba(255,251,243,0.96), rgba(255,251,243,0) 60%), radial-gradient(110% 80% at 100% 100%, rgba(186,166,140,0.92), rgba(186,166,140,0) 70%), radial-gradient(60% 50% at 90% 15%, rgba(226,206,168,0.45), rgba(226,206,168,0) 70%), linear-gradient(168deg, rgba(234,226,213,0.93), rgba(209,197,180,0.94));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.42), inset 0 1px 0 rgba(255,255,255,0.70), 0 12px 30px rgba(24,18,12,0.20), 0 2px 6px rgba(24,18,12,0.14); }
  .s-espresso .card { color: #F6EFE5; --soft: #D4C2AB; --fitC: #E8CC9C; --fitEdge: rgba(232,204,156,0.50); --kg: #E7C995; --lowC: #F0A070; --hair: rgba(255,226,190,0.13); --grain: 0.11; --blend: overlay;
    text-shadow: 0 1px 1px rgba(0,0,0,0.25);
    --light: linear-gradient(120deg, rgba(255,214,170,0.09), rgba(255,214,170,0) 42%);
    background: radial-gradient(120% 90% at 0% 0%, rgba(166,124,88,0.46), rgba(166,124,88,0) 58%), radial-gradient(100% 80% at 100% 100%, rgba(58,38,27,0.55), rgba(58,38,27,0) 65%), radial-gradient(60% 60% at 95% 20%, rgba(96,70,52,0.30), rgba(96,70,52,0) 70%), linear-gradient(168deg, rgba(50,36,28,0.87), rgba(25,19,16,0.92));
    box-shadow: inset 0 0 0 1px rgba(255,226,190,0.10), inset 0 1px 0 rgba(255,230,200,0.15), 0 12px 30px rgba(24,18,12,0.20), 0 2px 6px rgba(24,18,12,0.14); }
  .s-titanium .card { color: #FFFFFF; --soft: #E4E6E8; --fitC: #F3E4C6; --fitEdge: rgba(243,228,198,0.60); --kg: #F3DFB6; --lowC: #FFB089; --hair: rgba(255,255,255,0.20); --grain: 0.12; --blend: overlay;
    text-shadow: 0 1px 2px rgba(20,22,24,0.40);
    --light: linear-gradient(115deg, rgba(255,246,232,0.12), rgba(255,246,232,0) 48%);
    background: radial-gradient(130% 90% at 0% 0%, rgba(240,232,220,0.42), rgba(240,232,220,0) 58%), radial-gradient(100% 80% at 100% 100%, rgba(84,90,96,0.55), rgba(84,90,96,0) 68%), radial-gradient(60% 50% at 90% 12%, rgba(214,196,170,0.22), rgba(214,196,170,0) 70%), linear-gradient(168deg, rgba(128,133,138,0.66), rgba(70,75,80,0.76));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22), inset 0 1px 0 rgba(255,255,255,0.38), 0 12px 30px rgba(24,18,12,0.20), 0 2px 6px rgba(24,18,12,0.14); }
  /* safe text mode: plain look only — lines still fit by shrinking, never wrap or spill */
  .text .card { border-left: 0; box-shadow: none; border-radius: 6px; }
  .text .inner { gap: 0.1em; }
  .text .head, .text .codeRow { justify-content: flex-start; }
  .text .code { font-size: 1.1em; }
</style>
</head>
<body>
<div id="stage"><div id="col"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
(function () {
  var ACCENT = '#F1D88E', LOW = '#FF9F43', TOP = 134, BOTTOM_KEEP = 88;
  /* Facebook fills tall phones (19.5:9) with this 9:16 video and cuts about 9% off each side
     (48 of 540 units). Cards stay inside what phones really show, plus a small gap. */
  var CROP = 48, GAP = 8, SAFE = CROP + GAP;
  var ORDER = ['XS','S','M','L','XL','2XL','3XL','4XL','5XL'];
  var SLOTS = [
    { id: 'promo', label: '' },
    { id: 'shirt', label: 'អាវលើខ្លួន' },
    { id: 'pants', label: 'ខោលើខ្លួន' },
    { id: 'hand',  label: 'លើដៃ' },
    { id: 'hand2', label: 'លើដៃ' }
  ];
  var params = new URLSearchParams(location.search);
  var onlySlot = params.get('slot');
  var demo = params.get('demo') === '1';

  var stage = document.getElementById('stage');
  var col = document.getElementById('col');
  stage.style.setProperty('--accent', ACCENT);
  stage.style.setProperty('--low', LOW);

  /* scale the 540x960 design to whatever size OBS gives the source */
  function fitStage() { stage.style.transform = 'scale(' + (window.innerWidth / 540) + ')'; }
  window.addEventListener('resize', function () { fitStage(); layout(); });
  fitStage();

  var state = { guides: {}, slots: {}, entries: {}, settings: { textSize: 20, minText: 12, width: 2, mode: 'cards' } };

  function sizeKey(s) { var i = ORDER.indexOf(s); if (i >= 0) return i; var n = parseFloat(s); return isNaN(n) ? 999 : 100 + n; }
  function kg(v) { v = String(v || '').trim(); if (!v) return ''; return /kg/i.test(v) ? v : v + 'kg'; }
  function money(p) { p = String(p || '').trim(); if (!p) return ''; return /\$/.test(p) ? p : p + '$'; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  var STD_LABELS = ['អាវលើខ្លួន', 'ខោលើខ្លួន', 'អាវលើដៃ', 'ខោលើដៃ'];
  /* label shown on a card: typed on the card > based on the slot (worn / in hand) and the garment kind in Live Log */
  function defaultLabel(slotId, entry) {
    var gt = String((entry && entry.garmentType) || '').trim();
    if (gt && STD_LABELS.indexOf(gt) < 0) return gt;
    var pants = /ខោ/.test(gt);
    if (slotId === 'shirt') return 'អាវលើខ្លួន';
    if (slotId === 'pants') return 'ខោលើខ្លួន';
    return pants ? 'ខោលើដៃ' : 'អាវលើដៃ';
  }
  /* ---------- kinds: shirt & pants show weights, belts show length in cm, glasses/masks show colours only ----------
     Each code's kind is set on the host screen (Live Log "kind"); if not set it is guessed from the Vrich type word and sizes. */
  var KINDS = {
    shirt:   { t: 'អាវ · S–4XL',        kg: true },
    pants:   { t: 'ខោ · ចង្កេះ',          kg: true, optional: true },  /* waist sizes: weight only if that code has its own; never a guide or a warning */
    belt:    { t: 'ខ្សែក្រវ៉ាត់ · cm',   kg: false, unit: 'cm' },
    glasses: { t: 'វ៉ែនតា · no size',     kg: false, nosize: true },
    mask:    { t: 'ម៉ាស់ · no size',      kg: false, nosize: true },
    other:   { t: 'Other · no size',      kg: false, nosize: true }
  };
  function guessKind(d, entry) {
    if (entry && KINDS[entry.kind]) return entry.kind;
    var t = [(entry && entry.garmentType) || '', (d && d.type) || '', (d && d.label) || ''].join(' ');
    if (/ខ្សែក្រវ៉ាត់|ខ្សែ|belt/i.test(t)) return 'belt';
    if (/វ៉ែនតា|glass/i.test(t)) return 'glasses';
    if (/ម៉ាស់|mask/i.test(t)) return 'mask';
    var zs = [];
    ((d && d.colors) || []).forEach(function (c) { (c.sizes || []).forEach(function (s) { zs.push(String(s.z || '')); }); });
    var real = zs.filter(function (z) { return z && z !== '—' && !/^(F|FREE|FS|OS)$/i.test(z); });
    if (zs.length && !real.length) return 'other';
    if (real.length && real.every(function (z) { return /^\d+(\.\d)?(CM)?$/i.test(z); })) {
      return Math.max.apply(null, real.map(parseFloat)) >= 60 ? 'belt' : 'pants';
    }
    if (/ខោ/.test(t)) return 'pants';
    return 'shirt';
  }
  var KIND_LABEL = { belt: 'ខ្សែក្រវ៉ាត់', glasses: 'វ៉ែនតា', mask: 'ម៉ាស់' };
  function cardLabel(slotId, d, entry) {
    if (d && d.label) return d.label;
    var gt = String((entry && entry.garmentType) || '').trim(), k = guessKind(d, entry);
    if (KIND_LABEL[k]) return gt && !/^(អាវ|ខោ)លើ/.test(gt) ? gt : KIND_LABEL[k];
    return defaultLabel(slotId, entry);
  }
  function showSize(z, kind) { return kind === 'belt' && /^\d+(\.\d)?$/.test(z) ? z + 'cm' : String(z).replace(/CM$/i, 'cm'); }

  /* merge one slot's Vrich stock with its Live Log entry */
  function model(slot) {
    var d = state.slots[slot.id];
    if (d && d.type === 'promo') {
      if (d.show === false || (!d.title && !(d.lines || []).length)) return null;
      return { key: slot.id, promo: true, at: '9999', title: d.title || '', lines: (d.lines || []).filter(Boolean) };
    }
    if (!d || !d.code) return null;
    var entry = state.entries[String(d.code).toUpperCase()] || {};
    var kind = guessKind(d, entry), K = KINDS[kind];
    var colors = (d.manual && d.manual.colors)
      /* colours/sizes typed by hand on the host screen (stream only); everything else still comes from Live Log */
      ? d.manual.colors.map(function (c) { return { c: c.c, sizes: (c.sizes || []).map(function (z) { var low = z.charAt(0) === '!'; return { z: low ? z.slice(1) : z, low: low }; }) }; })
      : (d.colors || []).map(function (c) {
      var inStock = (c.sizes || []).filter(function (s) { return s.remain > 0; });
      var total = inStock.reduce(function (a, s) { return a + (Number(s.remain) || 0); }, 0);
      var sizes = inStock.sort(function (a, b) { return sizeKey(a.z) - sizeKey(b.z); })
        .map(function (s) { return { z: s.z, low: s.remain <= 2 }; });
      return { c: /^(អាវ|ខោ|ឈុត|ស្បែកជើង|មួក|ខ្សែក្រវ៉ាត់|ខ្សែ|វ៉ែនតា|ម៉ាស់|កាបូប|ស្រោម)/.test(c.c || '') ? '' : (c.c || ''), sizes: sizes, low: total <= 2 };
    }).filter(function (c) { return c.sizes.length; });
    var all = {}; colors.forEach(function (c) { c.sizes.forEach(function (s) { all[s.z] = 1; }); });
    var weights = entry.weights || {}, guide = K.optional ? {} : ((state.guides && state.guides[kind]) || {});
    var sizes = !K.kg ? [] : Object.keys(all).sort(function (a, b) { return sizeKey(a) - sizeKey(b); })
      .map(function (s) { return { s: s, k: kg(weights[s] || guide[s]) }; }).filter(function (x) { return x.k; });
    if (K.nosize) colors = colors.map(function (c) { return { c: c.c, sizes: [], low: c.low }; });
    else colors.forEach(function (c) { c.sizes.forEach(function (s) { s.z = showSize(s.z, kind); }); });
    return {
      key: slot.id, at: d.at || '', code: d.code, kind: kind, nosize: !!K.nosize,
      label: cardLabel(slot.id, d, entry),
      fit: entry.fit || '', price: money(entry.price || d.price),
      colors: colors, sizes: sizes, note: String(entry.note || '').trim()
    };
  }

  function cardEl(m) {
    var card = el('div', 'card'); var inner = el('div', 'inner'); card.appendChild(inner);
    if (m.promo) {
      var ph = el('div', 'head'); ph.appendChild(el('span', 'fit', '🎁 Giveaway')); inner.appendChild(ph);
      if (m.title) inner.appendChild(el('div', 'code promoTitle', m.title));
      var pl = el('div'); m.lines.forEach(function (t) { pl.appendChild(el('div', 'line', t)); }); inner.appendChild(pl);
      card.dataset.key = m.key; card.dataset.at = m.at; card.dataset.promo = '1';
      return card;
    }
    var head = el('div', 'head'); head.appendChild(el('span', 'label', m.label));
    if (m.fit) head.appendChild(el('span', 'fit', m.fit));
    inner.appendChild(head);
    var cr = el('div', 'codeRow'); cr.appendChild(el('span', 'code', m.code)); cr.appendChild(el('span', 'price', m.price)); inner.appendChild(cr);
    var lines = el('div');
    if (!m.colors.length) lines.appendChild(el('div', 'line', 'អស់ស្តុក'));
    if (m.nosize && m.colors.length) {
      /* glasses, masks…: just the colours in stock, on one line (orange = last pieces) */
      var one = el('div', 'line');
      m.colors.forEach(function (c) { one.appendChild(el('span', 'z' + (c.low ? ' low' : ''), c.c || 'មានស្តុក')); });
      lines.appendChild(one);
    } else {
      if (m.kind === 'pants' && m.colors.some(function (c) { return c.c; })) lines.appendChild(el('div', 'line dim small', 'ចង្កេះ'));
      m.colors.forEach(function (c) {
      var ln = el('div', 'line'); if (c.c) ln.appendChild(el('span', 'c', c.c));
      else if (m.kind === 'pants') ln.appendChild(el('span', 'c dim', 'ចង្កេះ')); /* no colour in Vrich: say what the numbers are */
      else if (m.kind === 'belt') ln.appendChild(el('span', 'c dim', 'ប្រវែង'));
      c.sizes.forEach(function (s) { ln.appendChild(el('span', 'z' + (s.low ? ' low' : ''), s.z)); });
      lines.appendChild(ln);
      });
    }
    inner.appendChild(lines);
    if (m.sizes.length) {
      var w = el('div', 'weights');
      m.sizes.forEach(function (x) { var r = el('div', 'w'); r.appendChild(el('span', 's', x.s)); r.appendChild(el('span', 'k', x.k)); w.appendChild(r); });
      inner.appendChild(w);
    }
    if (m.note) inner.appendChild(el('div', 'note', m.note));
    card.dataset.key = m.key; card.dataset.at = m.at;
    return card;
  }

  var dropped = [];
  function render() {
    var st = state.settings;
    var models = SLOTS.filter(function (s) { return !onlySlot || s.id === onlySlot; }).map(model).filter(Boolean)
      .filter(function (m) { return dropped.indexOf(m.key) < 0; });
    stage.classList.toggle('text', st.mode === 'text');
    stage.classList.toggle('glass', st.style === 'glass' && st.mode !== 'text');
    var LUX = ['smoked', 'champagne', 'espresso', 'titanium'], luxOn = LUX.indexOf(st.style) >= 0 && st.mode !== 'text';
    stage.classList.toggle('lux', luxOn);
    LUX.forEach(function (k) { stage.classList.toggle('s-' + k, luxOn && st.style === k); });
    stage.classList.toggle('frost', st.style === 'frost' && st.mode !== 'text');
    col.style.right = SAFE + 'px';
    col.style.width = (onlySlot ? 540 - SAFE * 2 : Math.round((540 - CROP * 2) * st.width / 6) - GAP) + 'px';
    if (onlySlot) { col.style.right = 'auto'; col.style.left = SAFE + 'px'; col.style.top = SAFE + 'px'; col.style.alignItems = 'flex-start'; }
    col.innerHTML = '';
    models.forEach(function (m) { var c = cardEl(m); c.style.fontSize = st.textSize + 'px'; col.appendChild(c); });
    layout();
  }

  /* V8 rules: shrink only cards that are too wide; keep the newest cards at their best size,
     hide the oldest if more than 2 do not fit. Text mode uses the same fitting, only a plainer look. */
  function layout() {
    var st = state.settings; var cards = Array.prototype.slice.call(col.children);
    if (!cards.length) return;
    var base = Number(st.textSize) || 20, MIN = Math.min(base, Number(st.minText) || 12);
    var wLimit = parseFloat(col.style.width);
    /* ONE text size for every card on screen, so the code (big = 1.35×) and the lines (normal = 1×)
       always match between cards. It is the set Text size, unless the longest line on any card would
       not fit the width — then all cards go down together (never below Smallest). */
    var shared = base;
    cards.forEach(function (card) {
      card.style.fontSize = base + 'px';
      if (card.dataset.promo) return;  /* giveaway text wraps instead */
      var inner = card.firstChild, head = inner.firstChild;
      head.style.display = 'none'; var natural = inner.scrollWidth; head.style.display = '';
      shared = Math.min(shared, (wLimit - 3) / (natural / base + 1.45));
    });
    shared = Math.max(MIN, shared);
    function apply(px) { cards.forEach(function (card) { card.style.fontSize = px.toFixed(1) + 'px'; }); }
    apply(shared);
    if (onlySlot) return;
    var availH = 960 - TOP - BOTTOM_KEEP, H = col.offsetHeight;
    if (H > availH && cards.length > 2) {
      var oldest = cards.filter(function (c) { return !c.dataset.promo; }).sort(function (a, b) { return String(a.dataset.at).localeCompare(String(b.dataset.at)); })[0];
      dropped.push(oldest.dataset.key); render(); return;
    }
    if (H > availH) apply(Math.max(MIN, shared * availH / H));
  }
  function rerender() { dropped = []; render(); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { layout(); });

  /* ---------- demo data (no database) ---------- */
  if (demo) {
    var now = Date.now();
    function stock(list) { return list.map(function (t) { var p = t.split(':'); return { c: p[0], sizes: p[1].split(' ').map(function (x) { var n = x.split('='); return { z: n[0], remain: Number(n[1]) }; }) }; }); }
    state.slots = {
      promo: { type: 'promo', show: true, title: 'ថ្ងៃនេះ Giveaway!', lines: ['ទាយលេខ ២ ខ្ទង់ (00–99)', 'រង្វាន់: E369 ១ ដើម', 'Comment លេខរបស់អ្នក 👇'] },
      shirt: { code: 'E369', price: '6.60', at: new Date(now - 3e5).toISOString(), colors: stock(['ខ្មៅ:L=4 XL=5 2XL=0 3XL=3 4XL=2', 'សាច់:L=3 XL=4 2XL=5 3XL=3 4XL=0', 'កាហ្វេ:L=5 XL=4 2XL=3 3XL=1 4XL=4']) },
      pants: { code: 'R295', price: '8.80', at: new Date(now - 6e5).toISOString(), colors: stock(['ខ្មៅ:S=3 M=4 L=5 XL=3', 'បៃតង:S=4 M=3 L=2 XL=5']) },
      hand:  { code: 'E136', price: '6.40', at: new Date(now).toISOString(), colors: stock(['ប្រផេះ:XL=3', 'ដី:XL=2', 'មេឃ:L=4 XL=0', 'ខៀវ:L=3 XL=4', 'សរ:XL=5 3XL=0']) }
    };
    state.entries = {
      E369: { garmentType: 'អាវលើខ្លួន', fit: 'រាងស្លុីម', price: '6.60', weights: { L: '50-60', XL: '60-70', '2XL': '70-80', '3XL': '80-85', '4XL': '85-90' } },
      R295: { garmentType: 'ខោលើខ្លួន', fit: 'រាងធម្មតា', price: '8.80', weights: { S: '50-60', M: '60-70', L: '70-80', XL: '80-85' } },
      E136: { garmentType: 'អាវលើដៃ', fit: 'រាងរលុង', price: '6.40', weights: { L: '60-70', XL: '70-80', '3XL': '85-90' } }
    };
    ['style', 'mode'].forEach(function (k) { if (params.get(k)) state.settings[k] = params.get(k); });
    ['textSize', 'width'].forEach(function (k) { if (params.get(k)) state.settings[k] = Number(params.get(k)); });
    render();
    return;
  }

  /* ---------- live data ---------- */
  firebase.initializeApp({
    apiKey: 'AIzaSyDDQp5_gvuRdX0flKQ3gm3zXJM_SXWUJSE', authDomain: 'vhm-catalog.firebaseapp.com', projectId: 'vhm-catalog',
    storageBucket: 'vhm-catalog.firebasestorage.app', messagingSenderId: '892196724857', appId: '1:892196724857:web:8ed3f5f056284b63aa34a8'
  });
  var db = firebase.firestore();
  var kvc = db.collection('kv');
  function parseData(snap) {
    if (!snap.exists) return null; var v = snap.data().data;
    if (v == null || v === '') return null;
    if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return null; } }
    return v;
  }

  /* Live Log entries: one listener per code currently on stream, so weights/fit added mid-live appear by themselves */
  var entryUnsubs = {};
  function syncEntryListeners() {
    var wanted = {};
    Object.keys(state.slots).forEach(function (k) { var d = state.slots[k]; if (d && d.code) wanted[String(d.code).toUpperCase()] = 1; });
    Object.keys(entryUnsubs).forEach(function (code) { if (!wanted[code]) { entryUnsubs[code](); delete entryUnsubs[code]; delete state.entries[code]; } });
    Object.keys(wanted).forEach(function (code) {
      if (entryUnsubs[code]) return;
      var key = 'live_log:' + code.replace(/\//g, '-');
      entryUnsubs[code] = kvc.doc(key).onSnapshot(function (snap) { state.entries[code] = parseData(snap) || {}; rerender(); },
        function (err) { console.warn('Live Log read failed for ' + code + ' — keeping what is on screen', err); });
    });
  }

  SLOTS.forEach(function (s) {
    kvc.doc('live_overlay_' + s.id).onSnapshot(function (snap) {
      state.slots[s.id] = parseData(snap); syncEntryListeners(); rerender();
    }, function (err) { console.warn('Slot ' + s.id + ' listener failed — keeping the last cards on screen', err); });
  });
  kvc.doc('live_overlay_guides').onSnapshot(function (snap) { state.guides = parseData(snap) || {}; rerender(); }, function () {});
  kvc.doc('live_overlay_settings').onSnapshot(function (snap) {
    var d = parseData(snap) || {};
    ['textSize', 'minText', 'width', 'mode', 'style'].forEach(function (k) { if (d[k] != null) state.settings[k] = d[k]; });
    rerender();
  }, function (err) { console.warn('Settings listener failed — using the last settings', err); });
})();
