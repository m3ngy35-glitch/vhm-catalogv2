<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15171c">
<title>VH MEN Chat Service Workbench</title>
<style>
:root{
  --bg:#f5f5f3; --surface:#fff; --ink:#15171c; --muted:#5b6270; --line:#dfe2e8; --line-strong:#c4c9d4;
  --accent:#2f6fed; --accent-ink:#fff; --accent-soft:#eaf0ff; --accent-line:#b9ccf8;
  --ok:#17703a; --ok-bg:#e6f4ea; --ok-line:#9bd0ac;
  --warn:#7a4f00; --warn-bg:#fff4d6; --warn-line:#ecca72;
  --bad:#a32525; --bad-bg:#fde8e8; --bad-line:#f0b4b4;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Khmer","Khmer UI","Leelawadee UI","Khmer OS Battambang",Arial,sans-serif;
  --sheet-h:96px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:3px solid #7aa2ff;outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
[hidden]{display:none!important}
.skip{position:absolute;left:-999px;top:0;background:#000;color:#fff;padding:8px 12px;z-index:200}
.skip:focus{left:8px;top:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.kh{font-family:var(--font);line-height:1.6}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh;min-height:100dvh}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px;flex:none}
.brand h1{font-size:16px;line-height:1.2}
.brand p{font-size:12px;color:var(--muted)}
.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.staff{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.staff select{min-height:36px;border:1px solid var(--line-strong);border-radius:8px;padding:4px 8px;background:#fff;color:var(--ink);font-size:14px}
#statusChips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:#fff;color:var(--ink);white-space:nowrap}
.chip.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.chip.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.chip.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.chip.accent{background:var(--accent-soft);border-color:var(--accent-line);color:#1f4fb8}

nav#nav{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:4px;padding:6px 10px;overflow-x:auto;scrollbar-width:none}
nav#nav::-webkit-scrollbar{display:none}
nav#nav button{border:0;background:transparent;border-radius:8px;padding:9px 14px;min-height:44px;font-weight:600;color:var(--muted);white-space:nowrap}
nav#nav button[aria-current="page"]{background:var(--accent-soft);color:#1f4fb8}
nav#nav button:hover{background:#f0f2f6}

main#main{padding:12px 14px calc(var(--sheet-h) + 18px);min-width:0}
.searchwrap{position:sticky;top:0;z-index:20;background:var(--bg);padding:2px 0 10px}
.searchbox{position:relative}
.searchbox input{width:100%;min-height:48px;border:1.5px solid var(--line-strong);border-radius:12px;padding:10px 14px 10px 40px;font-size:16px;background:#fff}
.searchbox input:focus{border-color:var(--accent)}
.searchbox .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 10px 30px rgba(10,20,40,.14);max-height:min(60vh,520px);overflow:auto;z-index:30}
.res{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:#fff;padding:10px 12px;min-height:48px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res:hover,.res[aria-selected="true"]{background:var(--accent-soft)}
.res .t{font-weight:650}
.res .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.res-empty{padding:14px;color:var(--muted)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:#eef0f4;color:#3b4252;flex:none;margin-top:2px}
.badge.product{background:#e9eefc;color:#1f4fb8}
.badge.stock{background:var(--ok-bg);color:var(--ok)}
.badge.qa{background:#f3e9fb;color:#6b2f9a}
.badge.template{background:#fdeedd;color:#8a4b00}
.badge.category{background:#eef0f4;color:#3b4252}
.badge.inactive{background:#eee;color:#666}
.badge.warn{background:var(--warn-bg);color:var(--warn)}

.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card h2,.card h3{font-size:15px;margin-bottom:8px}
.sec-title{font-size:18px;font-weight:700;margin:4px 0 10px}
.banner{border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0;border:1px solid var(--line);background:#fff}
.banner.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.banner.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.banner.info{background:var(--accent-soft);border-color:var(--accent-line);color:#1f3f8a}
.banner ul{margin:4px 0 0 18px;padding:0}
.empty{padding:22px 10px;text-align:center;color:var(--muted)}

/* ---------- buttons / fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:7px 14px;border-radius:9px;border:1px solid var(--line-strong);background:#fff;font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{background:#f3f5f9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2560d4}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn.sm{min-height:40px;padding:3px 10px;font-size:13px;border-radius:8px}
.btn.big{min-height:52px;font-size:17px;border-radius:12px}
.btn.copied{background:var(--ok)!important;border-color:var(--ok)!important;color:#fff!important}
.btn.amber{background:var(--warn-bg)!important;border-color:var(--warn-line)!important;color:var(--warn)!important}
.btn.link{border:0;background:none;color:#1f4fb8;text-decoration:underline;min-height:0;padding:2px 4px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea,input.in,select.in,textarea.in{border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:#fff;color:var(--ink);font-size:15px;min-height:40px;width:100%}
.fld textarea,textarea.in{min-height:84px;resize:vertical}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:20px;height:20px}

/* ---------- product / stock ---------- */
.codes{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.codebtn{border:1.5px solid var(--accent);background:#fff;color:var(--accent);border-radius:999px;padding:6px 14px;min-height:36px;font-weight:700}
.codebtn[aria-pressed="true"]{background:var(--accent);color:#fff}
.phead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.pname{font-size:18px;font-weight:750}
.pprice{font-size:15px;color:#333}
.cblock{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.cblock.soldout{background:#fafafa}
.cname{font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sizes{display:flex;gap:6px;flex-wrap:wrap}
.sz{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:5px 10px;border:1.5px solid;font-weight:650;font-size:14px}
.sz.on{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.sz.off{background:#f0f0f0;border-color:#cfcfcf;color:#6b6b6b}
.sz.off .n{text-decoration:line-through}
.sz small{font-weight:600;text-decoration:none;font-size:12px}
.sz .est{color:var(--warn);font-weight:700}
.qchip{border:1.5px solid var(--accent-line);background:#fff;color:#1f4fb8;border-radius:10px;padding:6px 12px;min-height:40px;font-weight:650}
.qchip:hover{background:var(--accent-soft)}
.qchip.off{color:#6b6b6b;border-color:#cfcfcf;text-decoration:line-through}
.qgroup{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:#fcfcfd}
.qgroup>h4{font-size:13px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fitrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.fitrow .fld{flex:1 1 120px}

/* ---------- lists ---------- */
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;margin-bottom:8px}
.item h3{font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.item .txt{white-space:pre-wrap;font-size:14.5px;color:#222;margin:4px 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.item.inactive{background:#f7f7f7;opacity:.85}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.toolbar .fld{flex:1 1 160px}
details.acc{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px}
details.acc>summary{padding:10px 12px;font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center}
details.acc>div{padding:2px 12px 12px}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tablewrap{overflow-x:auto}

/* ---------- composer ---------- */
.composer{background:#fff;display:flex;flex-direction:column;min-height:0;min-width:0}
.cmp-head{padding:10px 14px 6px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.cmp-head h2{font-size:15px}
.cmp-head .src{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.cmp-toggle{display:none}
.cmp-peek{display:none}
.cmp-body{padding:10px 14px;overflow:auto;flex:1;min-height:0}
.cmp-text{width:100%;min-height:170px;resize:vertical;font-size:16px;line-height:1.55;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:10px;background:#fff}
.cmp-text:focus{border-color:var(--accent)}
.cmp-text.flash,.cmp-peek.flash{animation:flash 1.1s ease}
@keyframes flash{0%{background:#ffe9a8}100%{background:#fff}}
.cmp-actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.cmp-sub{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.cmp-sub h3{font-size:13px;color:var(--muted);margin-bottom:6px}
.preview{white-space:pre-wrap;border:1px dashed var(--line-strong);border-radius:10px;padding:8px 10px;background:#fafafa;font-size:15px}
.preview mark{background:#ffd9d9;color:var(--bad);border-radius:4px;padding:0 3px;font-weight:700}
.cmp-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
.cmp-foot .row{flex-wrap:nowrap}
.cmp-foot .btn.big{flex:1 1 auto}
.cmp-status{font-size:13px;min-height:18px;margin-top:6px}
.cmp-status.ok{color:var(--ok)}.cmp-status.bad{color:var(--bad)}
.edited{font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 7px}
.ext{font-size:12.5px;color:var(--muted);margin-top:8px}
.ext a{color:#1f4fb8}

/* ---------- dialog / toast ---------- */
dialog{border:0;border-radius:14px;padding:0;width:min(640px,96vw);max-height:92dvh;box-shadow:0 24px 70px rgba(10,20,40,.35);color:var(--ink)}
dialog.wide{width:min(900px,96vw)}
dialog::backdrop{background:rgba(10,14,25,.5)}
dialog[open]{display:flex;flex-direction:column}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:17px}
.dlg-body{padding:14px 16px;overflow:auto;flex:1;min-height:0}
.dlg-foot{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
#toasts{position:fixed;top:10px;right:10px;left:10px;z-index:300;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;max-width:min(460px,100%);background:#1d2230;color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.warn{background:#6b4800}.toast.error{background:#8b1f1f}.toast.ok{background:#14562f}
.form{display:flex;flex-direction:column;gap:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcast-img{max-width:100%;max-height:200px;border-radius:10px;border:1px solid var(--line);margin-top:8px;display:block}

/* ---------- breakpoints ---------- */
@media (min-width:860px){
  .app{height:100vh;height:100dvh;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto auto minmax(0,1fr)}
  .topbar,nav#nav{grid-column:1/-1}
  main#main{grid-column:1;grid-row:3;overflow:auto;padding-bottom:24px}
  .composer{grid-column:2;grid-row:3;border-left:1px solid var(--line);position:static}
}
@media (min-width:1100px){
  .app{grid-template-columns:200px minmax(0,1fr) 420px;grid-template-rows:auto minmax(0,1fr)}
  nav#nav{grid-column:1;grid-row:2;flex-direction:column;border-bottom:0;border-right:1px solid var(--line);padding:10px;overflow:auto}
  nav#nav button{text-align:left}
  main#main{grid-column:2;grid-row:2}
  .composer{grid-column:3;grid-row:2}
  .twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
}
@media (max-width:859px){
  .composer{position:fixed;left:0;right:0;bottom:0;z-index:60;border:1px solid var(--line-strong);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:0 -8px 28px rgba(10,20,40,.16);max-height:var(--vvh,85vh)}
  .composer:not(.open) .cmp-body{display:none}
  .composer:not(.open) .cmp-peek{display:-webkit-box}
  .cmp-toggle{display:inline-flex}
  .cmp-peek{padding:6px 14px;font-size:14px;color:#222;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
  .composer.open{height:min(var(--vvh,85vh),640px)}
  .btn,.qchip,.codebtn,nav#nav button,.res{min-height:44px}
  .btn.sm{min-height:44px}
  .topbar{padding:8px 12px}
  .brand h1{font-size:15px}
  .form .two{grid-template-columns:1fr}
}
@media (pointer:coarse){.btn.sm{min-height:44px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#staffSelect,#cmpTplSelect,#cmpGreet,#cmpReset,#cmpClear,#btnSettings{min-height:40px}
@media (max-width:899px),(pointer:coarse){#staffSelect,#cmpTplSelect,#cmpGreet,#cmpReset,#cmpClear,#btnSettings,.btn.sm{min-height:44px}}

/* ---------- stock relay bar (every tab) + split-screen / narrow layout ---------- */
nav#nav button .s{display:none}
.brand h1 .s{display:none}
.chip-stock{display:none}
.searchwrap{display:flex;flex-direction:column;gap:6px}
.stockbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;background:#fff;border:1px solid var(--line-strong);border-left:4px solid #c4c9d4;border-radius:10px;padding:5px 6px 5px 10px;min-width:0}
.stockbar.ok{border-left-color:var(--ok);background:#f4fbf6}
.stockbar.warn{border-left-color:#d79a00;background:#fffaf0}
.stockbar.busy{border-left-color:var(--accent)}
.sb-main{flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;font-size:13px}
.sb-label{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.sb-text{overflow-wrap:anywhere}
.sb-who{color:var(--muted);font-size:12px}
.stockbar .btn{flex:none}
.sb-msg{flex:1 1 100%;font-size:12.5px;color:var(--bad);overflow-wrap:anywhere}
.sb-msg.warn{color:var(--warn)}
.item,.card,.pname,.res,.cname,.sz,.qchip,.codebtn,.toast,.banner,.cmp-peek,.cmp-src{overflow-wrap:anywhere}
.btn,.qchip{max-width:100%}
.btn{text-align:center}

@media (max-width:859px){
  nav#nav{display:flex;overflow:visible;padding:4px 6px;gap:2px}
  nav#nav button{flex:1 1 0;min-width:0;padding:6px 2px;font-size:13px;white-space:normal;line-height:1.2}
  nav#nav button .l{display:none}
  nav#nav button .s{display:inline}
  .brand h1 .l{display:none}
  .brand h1 .s{display:inline}
  .brand p{display:none}
  #btnSettings,.staff>span{display:none}
  .topbar{flex-wrap:nowrap;padding:6px 10px;gap:8px}
  .top-right{flex:1 1 auto;justify-content:flex-end;min-width:0;flex-wrap:wrap}
  #statusChips{flex:0 1 auto;min-width:0}
  .chip{white-space:normal;font-size:11.5px;padding:2px 8px;line-height:1.3;max-width:100%}
  .logo{width:28px;height:28px;font-size:11px}
  .staff select{max-width:42vw}
  main#main{padding:8px 10px calc(var(--sheet-h) + 18px)}
  .sec-title{font-size:16px;margin:2px 0 8px}
  .card{padding:10px 10px}
  .pname{font-size:16px}
}
@media (max-width:540px){
  .topbar{flex-wrap:wrap}
  nav#nav{flex-wrap:wrap}
  nav#nav button{flex:1 1 30%;min-height:40px}
  .top-right{flex:1 1 100%;justify-content:space-between}
  .staff select{max-width:none}
  .cmp-foot .row{flex-wrap:wrap}
  .cmp-foot .btn.big{flex:1 1 100%}
  .cmp-foot .btn:not(.big){flex:1 1 100%}
  .toolbar .fld{flex:1 1 100%}
  .row .btn{max-width:100%}
  .dlg-foot .btn{flex:1 1 auto}
  .fitrow .fld{flex:1 1 100%}
}
@media (max-width:380px){
  body{font-size:14.5px}
  .btn.sm{padding:3px 8px}
  .stockbar{padding-left:8px}
}
.chip .s{display:none}
@media (max-width:540px){
  .chip .l{display:none}
  .chip .s{display:inline}
  .topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center}
  .top-right{display:contents}
  .brand{grid-column:1}
  .staff{grid-column:2;grid-row:1}
  #statusChips{grid-column:1/-1;grid-row:2;gap:4px}
  nav#nav button{min-height:44px;flex:1 1 30%}
  .cmp-foot .row{flex-wrap:nowrap}
  .cmp-foot .btn.big{flex:1 1 auto;min-width:0;font-size:16px}
  .cmp-foot .btn:not(.big){flex:0 0 auto;padding:7px 10px;font-size:14px}
  .cmp-peek{-webkit-line-clamp:1!important}
  .cmp-head{padding:6px 12px 4px}
  .cmp-foot{padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
  .stockbar .btn.sm{padding:3px 8px}
}
/* toasts at the bottom so they never cover the stock bar / search / nav */
#toasts{top:auto;bottom:12px;left:12px;right:auto;align-items:flex-start;max-width:calc(100vw - 24px)}
@media (max-width:859px){#toasts{bottom:calc(var(--sheet-h) + 14px);right:12px;align-items:center}}
@media (max-width:859px){.btn.link{min-height:44px;padding:8px 10px}}
@media (max-width:859px){.composer:not(.open) .cmp-status{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;margin-top:4px}}

/* ---------- minimal UI ---------- */
.sec-title{display:none}
#btnSettings{display:none!important}
.stockbar.warn{background:#fff;border-left-color:#c4c9d4}
.sb-msg{color:var(--bad)}
.card{padding:8px 10px}
details.acc>summary{min-height:40px}
.cmp-sub{margin-top:6px;padding-top:6px}

<script>
'use strict';
/* =====================================================================
   VH MEN Chat Service Workbench  —  standalone copy-and-paste assistant.
   No Messenger / Meta integration. Same Firebase project + Firestore `kv`
   collection as the catalog tools (index.html / live.html).
   ===================================================================== */

/* ===== Firebase (unchanged project config — public client config, NOT a secret) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDDQp5_gvuRdX0flKQ3gm3zXJM_SXWUJSE",
  authDomain: "vhm-catalog.firebaseapp.com",
  projectId: "vhm-catalog",
  storageBucket: "vhm-catalog.firebasestorage.app",
  messagingSenderId: "892196724857",
  appId: "1:892196724857:web:8ed3f5f056284b63aa34a8"
};
let __db = null;
function firestore_(){
  if (!__db){ firebase.initializeApp(firebaseConfig); __db = firebase.firestore(); }
  return __db;
}

/* ===== Connection state — only what we can actually verify from real operations ===== */
const conn = { state:'unknown', okAt:null, err:'' };   // unknown | ok | cache | error | offline
function fbErrorText(e){
  const code = e && e.code ? String(e.code) : '';
  if (code.includes('permission-denied')) return 'Firebase refused access (check Firestore security rules)';
  if (code.includes('unavailable') || (navigator.onLine === false)) return 'Cannot reach Firebase (offline?)';
  return (e && e.message) ? e.message : String(e || 'Unknown error');
}
function setConn(state, err){
  conn.state = state;
  if (state === 'ok') conn.okAt = Date.now();
  conn.err = err ? fbErrorText(err) : '';
  if (typeof renderStatus === 'function') renderStatus();
}
const storage = {
  async getDoc(key){
    try{
      const doc = await firestore_().collection('kv').doc(key).get({source:'server'});
      setConn('ok');
      if (!doc.exists) return null;
      const d = doc.data();
      if (d.data === undefined || d.data === null) return null;
      return { key, data:d.data, updatedAtMs: (d.updatedAt && d.updatedAt.toMillis) ? d.updatedAt.toMillis() : null };
    }catch(e){ setConn(navigator.onLine === false ? 'offline' : 'error', e); throw e; }
  },
  async get(key){
    const r = await storage.getDoc(key);
    return r ? { key, value: JSON.stringify(r.data) } : null;
  },
  async set(key, value){
    try{
      await firestore_().collection('kv').doc(key).set({
        data: value,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      setConn('ok');
      return { key, value };
    }catch(e){ setConn(navigator.onLine === false ? 'offline' : 'error', e); throw e; }
  }
};

/* ===== Key helpers — identical key schemes to the previous version ===== */
function nameToken(n){ return String(n||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,''); }
function quickReplyLiveKey(name){ return 'quickreply_live_' + nameToken(name); }
function stockNameKey(name){ return 'stock_relay_' + nameToken(name); }
function liveLogKey(code){ return 'live_log:' + String(code).trim().toUpperCase().replace(/\//g, '-'); }
const CONFIG_KEY = 'quickreply_config_v1';            // NEW shared config document
const UPSELL_BROADCAST_KEY = 'upsell_broadcast';      // unchanged key

/* ===== Small utilities ===== */
const $ = id => document.getElementById(id);
const clone = o => JSON.parse(JSON.stringify(o));
function normalizeText(s){ return String(s == null ? '' : s).normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim(); }
function normCode(s){ return String(s == null ? '' : s).toUpperCase().replace(/\s+/g,''); }
function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsGetJSON(k){ try{ const r = lsGet(k); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function fmtTime(ms){ return new Date(ms).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function fmtDateTime(ms){ return ms ? new Date(ms).toLocaleString([], {dateStyle:'medium', timeStyle:'short'}) : '—'; }
function fmtAge(ms){
  const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60), r = m % 60;
  return h + ' h' + (r ? ' ' + r + ' min' : '') + ' ago';
}
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'text') el.textContent = v;
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'hidden' || k === 'selected') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
let toastTimer = 0;
function toast(msg, kind, ms){
  const box = $('toasts');
  const t = h('div', {class:'toast ' + (kind||'')}, msg);
  box.append(t);
  setTimeout(()=> t.remove(), ms || (kind === 'error' ? 7000 : 3800));
}

/* ===== Dialog helper (native <dialog>: focus trap + Esc) ===== */
const dlg = $('dlg');
function openDialog({title, body, actions = [], wide = false}){
  dlg.innerHTML = '';
  const head = h('div', {class:'dlg-head'},
    h('h2', {id:'dlgTitle'}, title),
    h('button', {type:'button', class:'btn sm', 'aria-label':'Close dialog', onclick:()=> closeDialog()}, '✕'));
  const foot = h('div', {class:'dlg-foot'}, actions.map(a => h('button', {
    type:'button', class:'btn ' + (a.kind || ''),
    onclick: async (ev)=>{
      const btn = ev.currentTarget;
      if (btn.disabled) return;
      btn.disabled = true;
      let keep;
      try{ keep = await a.onClick(); }catch(e){ console.error(e); toast('Something went wrong: ' + (e.message||e), 'error'); keep = false; }
      if (keep !== false) closeDialog(); else btn.disabled = false;
    }
  }, a.label)));
  dlg.append(head, h('div', {class:'dlg-body'}, body), foot);
  dlg.classList.toggle('wide', !!wide);
  if (!dlg.open) dlg.showModal();
}
function closeDialog(){ if (dlg.open) dlg.close(); }
dlg.addEventListener('close', ()=>{ dlg.innerHTML = ''; });

/* ===== Clipboard ===== */
function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try{ ta.setSelectionRange(0, text.length); }catch(e){}
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
  document.body.removeChild(ta);
  return ok;
}
async function copyText(text){
  try{
    if (navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){ /* fall through to legacy copy */ }
  return fallbackCopy(text);
}
async function imageDataUrlToPngBlob(dataUrl){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      c.toBlob(b => b ? resolve(b) : reject(new Error('Could not convert the image')), 'image/png');
    };
    img.onerror = ()=> reject(new Error('Could not decode the image'));
    img.src = dataUrl;
  });
}
async function copyImage(dataUrl){
  if (!navigator.clipboard || !window.ClipboardItem) throw new Error('This browser cannot copy images to the clipboard');
  const png = await imageDataUrlToPngBlob(dataUrl);
  await navigator.clipboard.write([ new ClipboardItem({ 'image/png': png }) ]);
}
function download(filename, content, mime){
  const blob = new Blob([content], {type: mime || 'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = h('a', {href:url, download:filename});
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
}
function dateStamp(){ const d = new Date(); const p = n => String(n).padStart(2,'0'); return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()); }

/* ===== Stock parsing =====
   parseStockPasteChecked() uses EXACTLY the same record regex and field logic as the
   previous parseStockPaste() (same output structure), and additionally reports rows
   that look invalid or ambiguous instead of silently accepting them. */
const SIZE_ORDER = ['XS','S','M','L','XL','2XL','3XL','4XL','5XL'];
function sizeSortKey(s){
  const i = SIZE_ORDER.indexOf(s);
  if (i !== -1) return i;
  const n = parseFloat(s);
  return isNaN(n) ? 999 : 100 + n;
}
function plausibleSize(s){
  if (!s || s === '—') return false;
  if (SIZE_ORDER.includes(s.toUpperCase())) return true;
  if (/^\d{2}(\.\d)?$/.test(s)) return true;       // pants / shoe sizes like 29, 30, 42
  if (/^(F|FREE|FS|ONE|OS)$/i.test(s)) return true;
  return false;
}
function parseStockPasteChecked(raw){
  raw = String(raw == null ? '' : raw);
  const recordRe = /([\s\S]+?)\s*(\d+(?:\.\d+)?)\s+(\d+)\s+(\d+)\s*\/\s*(\d+)/g;
  const codes = new Map();
  const issues = [];
  let m, lastEnd = 0, n = 0;
  while ((m = recordRe.exec(raw)) !== null){
    n++; lastEnd = recordRe.lastIndex;
    const nameBlock = m[1];
    const lines = nameBlock.split('\n').map(l=>l.trim()).filter(Boolean);
    let line = lines.length ? lines[lines.length-1] : '';
    line = line.replace(/^\*+\s*/,'').replace(/!/g,'').trim();
    if (!line){ issues.push({row:n, msg:'Row ' + n + ': no product line found before the numbers — skipped.'}); continue; }
    const parts = line.split(/\s+/);
    const code = parts.shift();
    if (!code) continue;
    const tokens = parts.slice();
    const size = tokens.length ? tokens.pop() : '';
    if (tokens.length > 1) tokens.shift();
    const color = tokens.join(' ');
    const price = m[2];
    const remain = parseInt(m[5], 10);
    if (!codes.has(code)) codes.set(code, {price: price, colorMap: new Map()});
    const entry = codes.get(code);
    if (entry.price !== price) issues.push({row:n, code, msg: code + ': different prices appear on different rows (' + entry.price + ' vs ' + price + ') — showing the first.'});
    const colorMap = entry.colorMap;
    const key = color || '';
    if (!colorMap.has(key)) colorMap.set(key, []);
    colorMap.get(key).push({size: size || '—', remain});
    if (!size) issues.push({row:n, code, msg: code + ': no size found on row ' + n + '.'});
    else if (!plausibleSize(size)) issues.push({row:n, code, msg: code + ': "' + size + '" on row ' + n + ' is not a recognised size — check this row.'});
    if (!color) issues.push({row:n, code, msg: code + ': no color found on row ' + n + '.'});
    if (lines.length > 3) issues.push({row:n, code, msg: code + ': unusually long text before the numbers on row ' + n + ' — check it was read correctly.'});
    if (!Number.isFinite(remain)) issues.push({row:n, code, msg: code + ': quantity unreadable on row ' + n + '.'});
  }
  const trailing = raw.slice(lastEnd).trim();
  if (trailing) issues.push({msg:'Some text at the end was not recognised as a stock row and was ignored: "' + trailing.slice(0,60) + (trailing.length>60?'…':'') + '"'});
  if (!n && raw.trim()) issues.push({msg:'No stock rows were recognised in that text.'});
  codes.forEach((entry, code)=>{
    entry.colorMap.forEach((arr, color)=>{
      const seen = new Set();
      arr.forEach(s=>{
        if (seen.has(s.size)) issues.push({code, msg: code + ' ' + (color||'—') + ': size ' + s.size + ' appears more than once — availability may be ambiguous.'});
        seen.add(s.size);
      });
    });
  });
  return { codes, issues, rowCount:n };
}
function parseStockPaste(raw){ return parseStockPasteChecked(raw).codes; }

/* ===== Weight helpers (unchanged logic) ===== */
const LIVE_DEFAULT_WEIGHTS = { 'M':'50-60','L':'58-68','XL':'65-75','2XL':'75-85','3XL':'85-95','4XL':'90-105' };
function liveWeightRangeDisplay(rangeStr){
  if (!rangeStr) return '—';
  const clean = String(rangeStr).replace(/kg/gi, '').trim();
  const parts = clean.split('-').map(s=>s.trim()).filter(Boolean);
  if (parts.length === 2) return parts[0] + 'kg-' + parts[1] + 'kg';
  if (parts.length === 1) return parts[0] + 'kg';
  return String(rangeStr).trim();
}
function weightRangeParts(rangeStr){
  if (!rangeStr) return null;
  const clean = String(rangeStr).replace(/kg/gi, '').trim();
  const parts = clean.split('-').map(s=>s.trim()).filter(Boolean);
  if (parts.length === 2) return { min: parts[0], max: parts[1] };
  if (parts.length === 1) return { min: parts[0], max: parts[0] };
  return null;
}
function liveAllSizes(colorsArr){
  const set = new Set();
  colorsArr.forEach(c => c.sizes.forEach(s => set.add(s)));
  return Array.from(set).sort((a,b)=>sizeSortKey(a)-sizeSortKey(b));
}
function suggestSizeForWeight(kg, weightsMap){
  const ranges = SIZE_ORDER.filter(s => weightsMap[s]).map(s=>{
    const parts = String(weightsMap[s]).replace(/kg/gi,'').split('-').map(n=>parseFloat(n.trim()));
    return { size: s, min: parts[0], max: parts.length > 1 ? parts[1] : parts[0] };
  });
  if (!ranges.length) return null;
  const fit = ranges.find(r => kg <= r.max);
  return fit ? fit.size : ranges[ranges.length - 1].size;
}

/* =====================================================================

const asArr = v => Array.isArray(v) ? v : [];
const str = v => (v == null ? '' : String(v));
function normEntry(e){
  const answers = {};
  if (e.answers && typeof e.answers === 'object') for (const [k,v] of Object.entries(e.answers)) answers[String(k)] = str(v);
  return {
    id:str(e.id), title:str(e.title).trim(), categoryId:str(e.categoryId),
    phrasings:asArr(e.phrasings).map(str).filter(s=>s.trim()), keywords:asArr(e.keywords).map(str).filter(s=>s.trim()),
    answers, note:str(e.note), active:e.active !== false, priority:Number(e.priority)||0,
    insertMode:e.insertMode === 'append' ? 'append' : 'replace',
    expiresOn:/^\d{4}-\d{2}-\d{2}$/.test(str(e.expiresOn)) ? e.expiresOn : '',
    eligibleCodes:asArr(e.eligibleCodes).map(s=>normCode(s)).filter(Boolean),
    createdAt:Number(e.createdAt)||0, updatedAt:Number(e.updatedAt)||0
  };
}
function normalizeConfig(raw){
  const d = defaultConfig();
  if (!raw || typeof raw !== 'object') return d;
  const out = { schemaVersion:1, rev:Number(raw.rev)||0 };
  out.categories = Array.isArray(raw.categories)
    ? raw.categories.filter(c=>c && c.id && c.name).map(c=>({id:str(c.id), name:str(c.name), productSpecific:!!c.productSpecific}))
    : d.categories;
  out.entries = Array.isArray(raw.entries) ? raw.entries.filter(e=>e && e.id && str(e.title).trim()).map(normEntry) : d.entries;
  out.templates = Array.isArray(raw.templates)
    ? raw.templates.filter(t=>t && t.id && str(t.text).trim()).map(t=>({id:str(t.id), name:str(t.name)||'Template', kind:str(t.kind)||'general', text:str(t.text), active:t.active !== false, createdAt:Number(t.createdAt)||0, updatedAt:Number(t.updatedAt)||0}))
    : d.templates;
  out.workflows = Array.isArray(raw.workflows)
    ? raw.workflows.filter(w=>w && w.id && w.name).map(w=>({id:str(w.id), name:str(w.name), categoryIds:asArr(w.categoryIds).map(str), templateIds:asArr(w.templateIds).map(str), lang:str(w.lang),
        rules:{greeting:!!(w.rules && w.rules.greeting), productActions:!(w.rules && w.rules.productActions === false)}, escalation:str(w.escalation)}))
    : d.workflows;
  const s = raw.settings && typeof raw.settings === 'object' ? raw.settings : {};
  const langs = Array.isArray(s.languages) ? s.languages.filter(l=>l && l.code).map(l=>({code:str(l.code), label:str(l.label)||str(l.code)})) : [];
  out.settings = {
    staff: Array.isArray(s.staff) && s.staff.length ? s.staff.map(str).filter(Boolean) : d.settings.staff,
    defaultLang: str(s.defaultLang) || 'km',
    languages: langs.length ? langs : d.settings.languages,
    freshMinutes: Math.max(1, Number(s.freshMinutes) || d.settings.freshMinutes),
    defaultGreetingId: s.defaultGreetingId != null ? str(s.defaultGreetingId) : d.settings.defaultGreetingId,
    defaultUpsell: str(s.defaultUpsell),
    values: (s.values && typeof s.values === 'object') ? Object.fromEntries(Object.entries(s.values).map(([k,v])=>[k, str(v)])) : d.settings.values,
    valuesUpdatedAt: Number(s.valuesUpdatedAt) || 0
  };
  return out;
}

let cfg = defaultConfig();
let cfgSource = 'defaults';         // 'defaults' = built-in starter, not yet published | 'shared' = loaded from Firestore
const cfgMeta = { loaded:false, error:null, fromCache:false };
let cfgUnsub = null;

function subscribeConfig(){
  if (cfgUnsub){ cfgUnsub(); cfgUnsub = null; }      // never leave an obsolete listener behind
  try{
    cfgUnsub = firestore_().collection('kv').doc(CONFIG_KEY).onSnapshot({includeMetadataChanges:true}, snap=>{
      cfgMeta.fromCache = !!snap.metadata.fromCache;
      cfgMeta.error = null;
      let changed = false;
      if (snap.exists && snap.data() && snap.data().data){
        const next = normalizeConfig(snap.data().data);
        changed = (next.rev !== cfg.rev) || cfgSource !== 'shared';
        cfg = next; cfgSource = 'shared';
      } else if (!snap.metadata.fromCache){
        changed = cfgSource !== 'defaults';
        cfg = defaultConfig(); cfgSource = 'defaults';
      }
      cfgMeta.loaded = true;
      setConn(snap.metadata.fromCache ? 'cache' : 'ok');
      onConfigChanged(changed);
    }, err=>{
      cfgMeta.error = err; cfgMeta.loaded = true;
      setConn(navigator.onLine === false ? 'offline' : 'error', err);
      onConfigChanged(true);
    });
  }catch(e){ cfgMeta.error = e; cfgMeta.loaded = true; setConn('error', e); }
}
async function reloadConfig(){
  try{
    const r = await storage.getDoc(CONFIG_KEY);
    if (r){ cfg = normalizeConfig(r.data); cfgSource = 'shared'; } else { cfg = defaultConfig(); cfgSource = 'defaults'; }
    onConfigChanged(true);
  }catch(e){ toast('Could not reload settings: ' + fbErrorText(e), 'error'); }
}

let cfgSaving = false;
/* Optimistic-concurrency write: refuses to overwrite a newer version saved by someone else. */
async function mutateConfig(fn){
  if (cfgSaving){ toast('Still saving the previous change — try again in a moment.', 'warn'); return false; }
  const next = clone(cfg);
  fn(next);
  next.settings.languages = next.settings.languages.length ? next.settings.languages : defaultConfig().settings.languages;
  const size = new Blob([JSON.stringify(next)]).size;
  if (size > 900000){ toast('The shared library is too large to save (' + Math.round(size/1024) + ' KB, limit ≈ 900 KB). Remove or shorten entries first.', 'error'); return false; }
  cfgSaving = true;
  try{
    const ref = firestore_().collection('kv').doc(CONFIG_KEY);
    const baseRev = cfg.rev || 0;
    await firestore_().runTransaction(async tx=>{
      const snap = await tx.get(ref);
      const curRev = (snap.exists && snap.data() && snap.data().data) ? (Number(snap.data().data.rev) || 0) : 0;
      if (curRev !== baseRev){ const err = new Error('conflict'); err.code = 'app/conflict'; throw err; }
      next.rev = curRev + 1;
      tx.set(ref, { data: next, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    });
    setConn('ok');
    cfg = next; cfgSource = 'shared';
    onConfigChanged(true);
    return true;
  }catch(e){
    if (e && e.code === 'app/conflict'){
      toast('Someone else changed the shared settings. The latest version was loaded — please repeat your change.', 'warn', 8000);
      await reloadConfig();
    } else {
      setConn(navigator.onLine === false ? 'offline' : 'error', e);
      toast('Could not save: ' + fbErrorText(e), 'error');
    }
    return false;
  }finally{ cfgSaving = false; }
}

function isExpired(entry){
  if (!entry.expiresOn) return false;
  const end = new Date(entry.expiresOn + 'T23:59:59').getTime();
  return Date.now() > end;
}
function entryAnswer(entry){
  const want = currentLang();
  let a = entry.answers[want], used = want;
  if (!a || !a.trim()){
    const order = [cfg.settings.defaultLang, 'km', 'en'].concat(Object.keys(entry.answers));
    for (const l of order){ if (entry.answers[l] && entry.answers[l].trim()){ a = entry.answers[l]; used = l; break; } }
  }
  return { text: a || '', lang: used, fallback: used !== want };
}

let PRODUCTS = [];
const catalogState = { status:'loading', at:null, err:'' };
async function loadCatalog(){
  catalogState.status = 'loading'; renderStatus();
  try{
    const res = await storage.get('vhm-catalog-products');

    if (res && res.value){
      const parsed = JSON.parse(res.value);

    catalogState.err = '';

  catalogState.at = Date.now();
  renderStatus(); renderProducts();
}
function findCatalogProduct(code){
  const t = normCode(code);
  if (!t) return null;
  return PRODUCTS.find(p => normCode(p && p.code) === t) || null;
}

/* ===== Stock snapshot ===== */
const stock = { codes:new Map(), index:new Map(), source:null, staff:'', loadedAt:null, relayAt:null, issues:[], rows:0 };
function setStock(parsed, meta){
  stock.codes = parsed.codes;
  stock.index = new Map();
  parsed.codes.forEach((v,k)=> stock.index.set(normCode(k), k));
  stock.issues = parsed.issues; stock.rows = parsed.rowCount;
  Object.assign(stock, meta);
}
function stockFreshness(){
  if (!stock.source) return { level:'none', text:'No stock loaded' };
  const thr = cfg.settings.freshMinutes;
  if (stock.source === 'relay'){
    if (!stock.relayAt) return { level:'unknown', text:'Stock snapshot time unknown — freshness unverified' };
    const ageMin = (Date.now() - stock.relayAt) / 60000;
    if (ageMin > thr) return { level:'stale', ageMin, text:'Stock is ' + fmtAge(stock.relayAt).replace(' ago','') + ' old — stale (limit ' + thr + ' min)' };
    return { level:'fresh', ageMin, text:'Stock snapshot ' + fmtAge(stock.relayAt) };
  }
  return { level:'unknown', text:'Stock pasted manually at ' + fmtTime(stock.loadedAt) + ' — age of the data cannot be verified' };
}
const currentStockEntry = ()=> currentCode ? (stock.codes.get(stock.index.get(normCode(currentCode))) || null) : null;
let stockBusy = false;
/* Outcome of the last relay attempt (separate from the loaded data, so a failed refresh never wipes good stock). */
const relayState = { kind:'idle', msg:'', detail:'', at:null };   // idle | loading | ok | empty | unreadable | error | noname
function renderAfterStock(){
  if (stock.source && relayState.kind === 'ok' && stock.loadedAt !== renderAfterStock.seen){
    renderAfterStock.seen = stock.loadedAt;
    toast('✓ ' + stock.codes.size + ' code' + (stock.codes.size === 1 ? '' : 's') + ' loaded', 'ok');
  }
  renderStatus(); renderStockBar();
  const sec = currentSection();
  if (sec === 'products') renderProducts();
  if (sec === 'quick' || sec === 'products') renderQuick();
  renderComposer('light');
}
/* Replace the loaded stock with a new snapshot (relay or clipboard). Never forces a single code on screen:
   one code -> open it; several -> show the full list and keep the open one only if it is still there. */
async function applyLoadedStock(parsed, meta){
  setStock(parsed, meta);
  relayState.kind = 'ok'; relayState.msg = ''; relayState.at = Date.now();
  const keep = currentCode && (stock.index.get(normCode(currentCode)) || findCatalogProduct(currentCode));
  if (stock.codes.size === 1) await openProduct(Array.from(stock.codes.keys())[0], { stay:true });
  else if (keep) await openProduct(currentCode, { stay:true });
  else { currentCode = null; currentWeights = null; fitState = null; productView = { loading:false, missing:'' }; }
}
let lastClipText = '';
/* When the window regains focus (after the Vrich bookmarklet copied new stock), load that copy silently. */
async function autoLoadClipboardStock(){
  if (!prefs.autoClipStock || stockBusy || document.hidden) return;
  let t = '';
  try{ t = await navigator.clipboard.readText(); }catch(e){ return; }
  if (!t || t === lastClipText) return;
  lastClipText = t;
  const parsed = parseStockPasteChecked(t);
  if (!parsed.codes.size) return;
  await applyLoadedStock(parsed, { source:'paste', staff:getStaffName(), loadedAt:Date.now(), relayAt:null });
  renderAfterStock();
}
async function loadStockFromClipboard(){
  if (stockBusy) return;
  let text = '';
  try{ text = await navigator.clipboard.readText(); }
  catch(e){ openPasteStockDialog(); return; }
  lastClipText = text;
  if (!text || !text.trim()){ relayState.kind = 'unreadable'; relayState.msg = 'Clipboard is empty'; renderStockBar(); return; }
  const parsed = parseStockPasteChecked(text);
  if (!parsed.codes.size){ relayState.kind = 'unreadable'; relayState.msg = 'No stock rows in clipboard'; stock.issues = parsed.issues; renderStockBar(); return; }
  await applyLoadedStock(parsed, { source:'paste', staff:getStaffName(), loadedAt:Date.now(), relayAt:null });
  renderAfterStock();
}
function openPasteStockDialog(){
  const ta = h('textarea', {class:'in', style:'min-height:160px', placeholder:'Paste stock rows from Vrich (Ctrl+V)', 'aria-label':'Stock text to paste'});
  openDialog({ title:'Paste stock', body:ta, actions:[
    { label:'Cancel' },
    { label:'Load', kind:'primary', onClick: async ()=>{ if (!ta.value.trim()) return false; return (await useManualStock(ta.value)) ? undefined : false; } } ]});
  setTimeout(()=> ta.focus(), 50);
}
async function loadStockFromRelay(){
  const name = getStaffName();
  if (!name){ relayState.kind = 'noname'; relayState.msg = 'Pick your name'; renderStockBar(); $('staffSelect').focus(); return; }
  if (stockBusy) return;
  stockBusy = true; relayState.kind = 'loading'; relayState.msg = ''; renderStockBar();
  if (currentSection() === 'products') renderProducts();
  try{
    const r = await storage.getDoc(stockNameKey(name));
    if (!r){ relayState.kind = 'empty'; relayState.msg = 'No stock for ' + name + ' yet'; }
    else if (typeof r.data !== 'string'){ relayState.kind = 'unreadable'; relayState.msg = 'Could not read stock'; }
    else {
      const parsed = parseStockPasteChecked(r.data);
      if (!parsed.codes.size){ relayState.kind = 'unreadable'; relayState.msg = 'Could not read stock'; stock.issues = parsed.issues; }
      else {
        stockBusy = false;
        await applyLoadedStock(parsed, { source:'relay', staff:name, loadedAt:Date.now(), relayAt:r.updatedAtMs });
      }
    }
  }catch(e){ relayState.kind = 'error'; relayState.msg = 'Could not load stock'; relayState.detail = fbErrorText(e); }
  stockBusy = false; renderAfterStock();
}
/* Compact always-visible stock relay control (header area, every tab). */
function renderStockBar(){
  const box = $('stockBar'); if (!box) return;
  const name = getStaffName();
  let cls = '', txt = '';
  if (relayState.kind === 'loading'){ cls = 'busy'; txt = 'Loading…'; }
  else if (!stock.source){ txt = 'No stock'; }
  else { cls = 'ok'; txt = '✓ ' + stock.codes.size + ' code' + (stock.codes.size === 1 ? '' : 's'); }
  const bad = ['empty','unreadable','error','noname'].includes(relayState.kind);

    h('div', {class:'sb-main'},

      h('button', {type:'button', class:'btn primary sm', id:'relayLoad', disabled: stockBusy, onclick: loadStockFromRelay, 'aria-label': stock.source === 'relay' ? 'Refresh stock' : 'Load stock'},

  else if (stock.issues && stock.issues.length) box.append(h('div', {class:'sb-msg warn', id:'relayMsg'}, stock.issues.length + ' stock row(s) need checking'));
}
async function useManualStock(text){
  const parsed = parseStockPasteChecked(text);
  if (!parsed.codes.size){ relayState.kind = 'unreadable'; relayState.msg = 'No stock rows found'; stock.issues = parsed.issues; renderAfterStock(); return false; }
  await applyLoadedStock(parsed, { source:'paste', staff:getStaffName(), loadedAt:Date.now(), relayAt:null });
  renderAfterStock();
  return true;
}

/* ===== Weight logs (cached to avoid repeat reads) ===== */
const logCache = new Map();
async function loadSavedLog(code, force){
  const key = liveLogKey(code);
  const c = logCache.get(key);
  if (c && !force){
    const ttl = c.error ? 20000 : 300000;
    if (Date.now() - c.at < ttl) return c;
  }
  const rec = { at:Date.now(), log:null, error:'' };
  try{ const r = await storage.getDoc(key); rec.log = r ? r.data : null; }
  catch(e){ rec.error = fbErrorText(e); }
  logCache.set(key, rec);
  return rec;
}
async function weightsForCode(sizes, code, force){
  const rec = await loadSavedLog(code, force);
  const log = rec.log;
  const saved = (log && log.weights && typeof log.weights === 'object') ? log.weights : {};
  const hasSavedLog = Object.keys(saved).length > 0;
  const weightsMap = {}, specificSizes = new Set();
  sizes.forEach(s=>{
    if (saved[s]){ weightsMap[s] = saved[s]; specificSizes.add(s); }
    else weightsMap[s] = LIVE_DEFAULT_WEIGHTS[s] || '';
  });
  return { weightsMap, hasSavedLog, specificSizes, logError: rec.error };
}
const genericSizesOf = (sizes)=> currentWeights ? sizes.filter(s => !currentWeights.specificSizes.has(s)) : sizes.slice();

function colorsArrOf(se, onlyAvail){

  se.colorMap.forEach((sizes, color)=>{
    const list = onlyAvail ? sizes.filter(s => s.remain > 0) : sizes;
    if (!onlyAvail || list.length) arr.push({ color: color || '—', sizes: list.slice().sort((a,b)=>sizeSortKey(a.size)-sizeSortKey(b.size)).map(s=>s.size) });
  });
  return arr;
}
function colorsHavingSize(size, se){
  const colors = [];
  if (!se) return colors;
  se.colorMap.forEach((arr, color)=>{ if (arr.some(s => s.size === size && s.remain > 0)) colors.push(color || '—'); });
  return colors;
}
function buildAvailabilityReply(se){

}

async function openProduct(raw, opts){
  const n = normCode(raw);
  if (!n) return;
  const cp = findCatalogProduct(n);
  const sk = stock.index.get(n);
  if (!cp && !sk){
    currentCode = null; currentWeights = null; fitState = null;
    productView = { loading:false, missing:n };
    if (!(opts && opts.stay)) showSection('products'); else renderSection(currentSection());
    renderQuick(); renderComposer(true);
    return;
  }
  const token = ++openToken;
  currentCode = sk || cp.code;
  currentWeights = null; fitState = null;
  productView = { loading:true, missing:'' };
  if (!(opts && opts.stay)) showSection('products'); else { if (currentSection() === 'products') renderProducts(); }
  renderQuick(); renderComposer(true);
  const se = stock.codes.get(sk);
  if (se){
    const sizes = liveAllSizes(colorsArrOf(se, false));
    const wr = await weightsForCode(sizes, currentCode);
    if (token !== openToken) return;       // a newer lookup superseded this one
    currentWeights = wr;
  }
  productView = { loading:false, missing:'' };
  renderProducts(); renderQuick();
  // Auto-fill the reply box with the availability reply — but never overwrite text the person is editing.
  const refreshing = !!(opts && opts.stay);
  const canFill = refreshing
    ? (!draft.text.trim() || (draft.text === draft.base && draft.type === 'product' && /availability$/.test(draft.label || '') && (draft.label || '').includes(currentCode)))
    : (!draft.text.trim() || draft.text === draft.base);
  if (se && canFill){
    setDraft(buildAvailabilityReply(se), { label:'Product · ' + currentCode + ' · availability', type:'product', meta:metaStock() });
  }
}

function replyColorQuery(query){
  const se = currentStockEntry();
  if (!se){ toast('No stock loaded for this code.', 'warn'); return false; }

  for (const [color, arr] of se.colorMap.entries()){

      const av = arr.filter(s => s.remain > 0).sort((a,b)=>sizeSortKey(a.size)-sizeSortKey(b.size)).map(s=>s.size);
      if (av.length){ matchColor = color || '—'; sizes = av; break; }

function replyWeightSize(size){
  const range = weightRangeParts(currentWeights && currentWeights.weightsMap[size]);

  productDraft(range ? size + ' គីឡូ ' + range.min + ' ដល់ ' + range.max + 'kg បង' : 'គ្មានទិន្នន័យទម្ងន់សម្រាប់ទំហំ ' + size, 'weight ' + size, {size}, { genericWeights: generic });

function replyWeightAll(){
  if (!currentWeights){ toast('No weight data for this code.', 'warn'); return false; }
  const sizes = Object.keys(currentWeights.weightsMap).sort((a,b)=>sizeSortKey(a)-sizeSortKey(b));

  const lines = ['គីឡូ'];

}
function buildFitText(st){
  const { weightsMap, se, kg, cm, sizes, idx } = st;
  const size = sizes[idx];
  let note;
  const colors = colorsHavingSize(size, se);
  if (colors.length) note = 'មានស្តុក ពណ៌: ' + colors.join(', ');
  else {
    let altSize = null, altColors = [];
    for (const s of sizes){ const cs = colorsHavingSize(s, se); if (cs.length){ altSize = s; altColors = cs; break; } }
    note = altSize ? 'ទំហំ ' + size + ' អស់ស្តុក — សាកល្បង ' + altSize + ' (' + altColors.join(', ') + ')' : 'ទំហំ ' + size + ' អស់ស្តុកបច្ចុប្បន្ន';
  }
  const cmPart = cm ? ', កម្ពស់ ' + cm + 'cm' : '';
  return 'ទម្ងន់ ' + kg + 'kg' + cmPart + ' → សាកល្បងទំហំ ' + size + ' (' + liveWeightRangeDisplay(weightsMap[size]) + ') — ' + note;
}
function fitDraft(){
  const st = fitState;
  const size = st.sizes[st.idx];
  const generic = !currentWeights || currentWeights.logError || genericSizesOf([size]).length > 0;
  productDraft(buildFitText(st), 'fit estimate', {size}, { genericWeights: generic,
    notes:[{gate:false, text:'Size is an estimate from weight only' + (st.cm ? '; the height (' + st.cm + 'cm) is only added as a note and was NOT used to choose the size.' : '.')}] });
}
function renderFitAdjust(){

async function runFit(kg, cm){
  if (!kg || !isFinite(kg) || kg < 20 || kg > 250){ toast('Enter a realistic weight in kg (20–250).', 'warn'); return false; }
  const se = currentStockEntry();
  if (!se){ toast('No stock loaded for this code.', 'warn'); return false; }
  const knownSizes = liveAllSizes(colorsArrOf(se, false));
  const wr = currentWeights || await weightsForCode(knownSizes, currentCode);

  if (!size){ toast('No weight data for this product.', 'warn'); fitState = null; renderFitAdjust(); return false; }
  const sizes = SIZE_ORDER.filter(s => wr.weightsMap[s]);
  fitState = { weightsMap: wr.weightsMap, se, kg, cm, sizes, idx: Math.max(0, sizes.indexOf(size)) };
  renderFitAdjust(); fitDraft();
  return true;
}

/* =====================================================================
   Reply composer — one editable draft. Saved answers/templates are only ever
   COPIED INTO the draft as plain strings, so editing never changes a master.
   ===================================================================== */
const draft = { text:'', base:'', label:'', type:'', meta:{}, ctx:{size:'',color:''}, manual:{}, upsellLine:'', previewOpen:false };
const PH_RE = /\{([a-z_][a-z0-9_]*)\}/gi;

function draftKeys(){ const s = new Set(); for (const m of draft.text.matchAll(PH_RE)) s.add(m[1].toLowerCase()); return Array.from(s); }

/* Only values that are actually available (and, for price, verified) are substituted. */
function placeholderValue(key){
  const k = key.toLowerCase();
  const man = draft.manual[k];
  if (man != null && String(man).trim() !== '') return { value:String(man).trim(), src:'manual' };
  switch (k){
    case 'customer_name': return null;
    case 'product_code': return currentCode ? { value:currentCode, src:'product' } : null;
    case 'product_name': { const cp = findCatalogProduct(currentCode || ''); const n = cp && (cp.name || cp.nameKh); return n ? { value:n, src:'catalog' } : null; }
    case 'price': { const se = currentStockEntry(); return (se && stockFreshness().level === 'fresh') ? { value:String(se.price), src:'stock' } : null; }
    case 'size': return draft.ctx.size ? { value:draft.ctx.size, src:'selection' } : null;
    case 'color': return draft.ctx.color ? { value:draft.ctx.color, src:'selection' } : null;
  }
  const v = (cfg.settings.values || {})[k];
  return (v && String(v).trim()) ? { value:String(v).trim(), src:'settings' } : null;
}
function resolveDraft(){
  const missing = new Set();
  const text = draft.text.replace(PH_RE, (m, key)=>{ const r = placeholderValue(key); if (r) return r.value; missing.add(key.toLowerCase()); return m; });
  return { text, missing:Array.from(missing) };
}
function currentWarnings(){
  const w = [];
  const { missing } = resolveDraft();
  if (missing.length) w.push({ gate:true, text:'Fill in before sending: ' + missing.map(k => '{' + k + '}').join(', ') + ' — not available or not verified, so nothing was guessed.' });
  const m = draft.meta || {};
  (m.notes || []).forEach(n => w.push(n));
  return w;
}

/* ---------- rendering ---------- */
function autosize(){ const t = $('cmpText'); t.style.height = 'auto'; t.style.height = Math.min(Math.max(t.scrollHeight + 4, 170), 420) + 'px'; }
function syncTextarea(){ $('cmpText').value = draft.text; autosize(); }
function renderComposer(full){
  queuePush();
  const edited = draft.text !== draft.base;
  $('cmpEdited').hidden = !edited;
  $('cmpSrc').textContent = draft.label || 'Nothing prepared yet';
  const { text, missing } = resolveDraft();
  $('cmpPeek').textContent = text.trim() ? text : 'No reply prepared yet — search, or tap a quick reply.';
  // warnings
  const warns = currentWarnings();
  const wbox = $('cmpWarn'); wbox.innerHTML = '';
  warns.forEach(x => wbox.append(h('div', {class:'banner ' + (x.gate ? 'warn' : 'info'), role: x.gate ? 'alert' : null}, (x.gate ? '⚠ ' : 'ℹ ') + x.text)));
  // copy button state
  const cb = $('cmpCopy');
  const gated = warns.some(x => x.gate);
  cb.classList.toggle('amber', gated);
  if (!cb.classList.contains('copied')) cb.textContent = gated ? 'Copy reply (check ⚠)' : 'Copy reply';
  // preview
  const pv = $('cmpPreview');
  const showPv = draft.previewOpen || missing.length > 0;
  pv.hidden = !showPv;
  if (showPv){
    pv.innerHTML = '';
    let last = 0;
    for (const m of text.matchAll(PH_RE)){
      if (!missing.includes(m[1].toLowerCase())) continue;
      pv.append(text.slice(last, m.index), h('mark', null, m[0]));
      last = m.index + m[0].length;
    }
    pv.append(text.slice(last));
    if (!text) pv.textContent = '(empty)';
  }
  if (full !== 'light') renderFill();
}
function renderFill(){

function flashComposer(){

/* ---------- draft operations ---------- */
function greetingTemplates(){ return cfg.templates.filter(t => t.active && t.kind === 'greeting'); }
function textHasGreeting(text){ const n = normalizeText(text); return greetingTemplates().some(t => n.includes(normalizeText(t.text))); }
function applyAutoGreeting(text){
  const wf = activeWorkflow();
  if (!wf || !wf.rules || !wf.rules.greeting) return text;
  const g = cfg.templates.find(t => t.id === cfg.settings.defaultGreetingId && t.active);
  if (!g || textHasGreeting(text)) return text;
  return g.text + '\n\n' + text;
}
function setStatus(msg, kind){ const s = $('cmpStatus'); s.textContent = msg || ''; s.title = msg || ''; s.className = 'cmp-status ' + (kind || ''); }
function setDraft(text, o){
  o = o || {};
  if (o.autoGreeting !== false && o.type !== 'template') text = applyAutoGreeting(text);
  draft.text = text; draft.base = text;
  draft.label = o.label || ''; draft.type = o.type || '';
  draft.meta = o.meta || {};
  draft.ctx = Object.assign({size:'', color:''}, o.ctx || {});
  draft.upsellLine = '';
  syncTextarea(); renderComposer(); flashComposer(); setStatus('');
  queuePush(0);
  if (o.copy || prefs.autoCopy) copyReply();
}
function addNotes(notes){ if (!notes || !notes.length) return; draft.meta = draft.meta || {}; draft.meta.notes = (draft.meta.notes || []).concat(notes.filter(n => !(draft.meta.notes || []).some(x => x.text === n.text))); }
/* Append a block, refusing duplicates; greetings always go on top and only once. */
function insertBlock(text, o){
  o = o || {};
  const nt = normalizeText(text);
  if (!nt) return false;
  if (o.kind === 'greeting'){
    if (textHasGreeting(draft.text) || normalizeText(draft.text).includes(nt)){ toast('A greeting is already in this reply.', 'warn'); return false; }
    draft.text = draft.text.trim() ? text + '\n\n' + draft.text : text;
  } else {
    if (normalizeText(draft.text).includes(nt)){ toast('That text is already in the reply.', 'warn'); return false; }
    draft.text = draft.text.trim() ? draft.text.replace(/\s+$/, '') + '\n\n' + text : text;
    if (!draft.label) draft.label = o.label || '';
  }
  syncTextarea(); renderComposer(); flashComposer();
  return true;
}
function entryNotes(entry, ans){
  const notes = [];
  if (isExpired(entry)) notes.push({ gate:true, text:'This answer expired on ' + entry.expiresOn + ' — check the promotion/condition is still valid.' });
  if (entry.eligibleCodes.length && (!currentCode || !entry.eligibleCodes.includes(normCode(currentCode))))
    notes.push({ gate:true, text:'This answer applies only to code(s) ' + entry.eligibleCodes.join(', ') + (currentCode ? ' — the open product (' + currentCode + ') is not on the list.' : ' — no product is open.') });
  const cat = catById(entry.categoryId);
  if (cat && cat.productSpecific && currentStockEntry()) notes.push({ gate:false, text:'Generic saved answer. Product stock/size replies use verified product data and take priority over it.' });
  if (ans.fallback) notes.push({ gate:false, text:'No ' + langLabel(currentLang()) + ' version saved — showing ' + langLabel(ans.lang) + '.' });
  return notes;
}
function useEntry(entry, mode){
  const a = entryAnswer(entry);
  if (!a.text.trim()){ toast('This answer has no text yet.', 'warn'); return; }
  const notes = entryNotes(entry, a);
  const m = mode === 'auto' ? entry.insertMode : mode;
  if (m === 'insert' || m === 'append'){
    if (draft.text.trim()){ if (insertBlock(a.text, {label:'Q&A · ' + entry.title})) addNotes(notes), renderComposer(); return; }
  }
  setDraft(a.text, { label:'Q&A · ' + entry.title, type:'entry', meta:{ entryId:entry.id, notes } });
}
function useTemplate(t, mode){
  if (mode === 'insert' || (mode === 'auto' && draft.text.trim())){
    insertBlock(t.text, { kind: t.kind === 'greeting' ? 'greeting' : 'block', label:'Template · ' + t.name });
  } else {
    setDraft(t.text, { label:'Template · ' + t.name, type:'template', meta:{ notes:[] } });
  }
}
function addUpsell(){
  const inp = $('cmpUpsell');
  const line = inp.value.trim();
  if (!line){ toast('Type an upsell line first.', 'warn'); return; }
  if (draft.upsellLine && draft.text.includes(draft.upsellLine)) draft.text = draft.text.replace(draft.upsellLine, line);
  else if (normalizeText(draft.text).includes(normalizeText(line))){ toast('That upsell line is already in the reply.', 'warn'); return; }
  else draft.text = draft.text.trim() ? draft.text.replace(/\s+$/, '') + '\n\n' + line : line;
  draft.upsellLine = line;
  syncTextarea(); renderComposer(); flashComposer();
}

/* ---------- copy / phone relay ---------- */
let copyBusy = false;
async function copyReply(){
  if (copyBusy) return;
  const { text } = resolveDraft();
  if (!text.trim()){ setStatus('Nothing to copy yet.', 'bad'); return; }
  const gates = currentWarnings().filter(x => x.gate).map(x => x.text);
  if (gates.length && !confirm(gates.join('\n') + '\n\nCopy anyway?')){ setStatus(''); return; }
  copyBusy = true;
  const ok = await copyText(text);
  copyBusy = false;
  const btn = $('cmpCopy');
  if (ok){
    btn.classList.add('copied'); btn.textContent = '✓ Copied';
    setTimeout(()=>{ btn.classList.remove('copied'); renderComposer('light'); }, 2000);
    setStatus('Copied', 'ok');
    if (getStaffName()) sendToPhone(text);
  } else {
    draft.previewOpen = true; renderComposer('light');
    const pv = $('cmpPreview');
    try{ const r = document.createRange(); r.selectNodeContents(pv); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }catch(e){}
    setStatus('The browser blocked clipboard access. The final text is selected in the preview below — press Ctrl+C (or long-press → Copy) to copy it manually.', 'bad');
    if (!$('composer').classList.contains('open')) setSheet(true);
  }
}
/* Replies go to the staff member's phone page automatically (on select, on edit, on copy). Nothing is sent while
   the reply still has unfilled {placeholders}. */
let phoneBusy = false, lastPushed = '', pushTimer = null;
async function sendToPhone(textArg){
  const name = getStaffName();
  if (!name) return;
  const text = typeof textArg === 'string' ? textArg : resolveDraft().text;
  if (!text.trim() || phoneBusy) return;
  const sig = name + '\u0000' + text;
  if (sig === lastPushed) return;
  phoneBusy = true;
  try{
    await storage.set(quickReplyLiveKey(name), text);
    lastPushed = sig;
    if ($('cmpStatus').title) { $('cmpStatus').title = ''; if ($('cmpStatus').className.includes('bad')) setStatus(''); }
  }catch(e){ setStatus('Could not send to phone', 'bad'); $('cmpStatus').title = fbErrorText(e); }
  phoneBusy = false;
}
function queuePush(delay){
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>{ const r = resolveDraft(); if (r.text.trim() && !r.missing.length) sendToPhone(r.text); }, delay == null ? 600 : delay);
}

/* ---------- mobile sheet ---------- */
function setSheet(open){
  const c = $('composer');
  c.classList.toggle('open', open);
  $('cmpToggle').setAttribute('aria-expanded', open ? 'true' : 'false');
  $('cmpToggle').textContent = open ? 'Close ▼' : 'Edit ▲';
  if (open) setTimeout(()=> $('cmpText').scrollIntoView({block:'nearest'}), 50);
}
function initComposer(){
  const t = $('cmpText');
  t.addEventListener('input', ()=>{
    const before = draftKeys().join(',');
    draft.text = t.value;
    if (draft.upsellLine && !draft.text.includes(draft.upsellLine)) draft.upsellLine = '';
    autosize();
    renderComposer(draftKeys().join(',') === before ? 'light' : undefined);
  });
  t.addEventListener('focus', ()=>{ setTimeout(()=> t.scrollIntoView({block:'center', behavior:'smooth'}), 250); });
  $('cmpCopy').addEventListener('click', copyReply);
  $('cmpReset').addEventListener('click', ()=>{ if (draft.text === draft.base){ toast('Nothing to reset — the reply is unedited.'); return; } draft.text = draft.base; syncTextarea(); renderComposer(); toast('Reply reset to the generated version.'); });
  $('cmpClear').addEventListener('click', ()=>{ draft.text = ''; draft.base = ''; draft.label = ''; draft.meta = {}; draft.ctx = {size:'', color:''}; draft.manual = {}; draft.upsellLine = ''; syncTextarea(); renderComposer(); setStatus(''); });
  $('cmpGreet').addEventListener('click', ()=>{
    const g = cfg.templates.find(x => x.id === cfg.settings.defaultGreetingId && x.active) || greetingTemplates()[0];
    if (!g){ toast('No greeting template is set up (Templates).', 'warn'); return; }
    insertBlock(g.text, {kind:'greeting'});
  });
  $('cmpUpsellAdd').addEventListener('click', addUpsell);
  $('cmpTplSelect').addEventListener('change', (e)=>{
    const tpl = cfg.templates.find(x => x.id === e.target.value);
    e.target.value = '';
    if (tpl) useTemplate(tpl, 'insert');
  });
  $('cmpToggle').addEventListener('click', ()=> setSheet(!$('composer').classList.contains('open')));
  $('cmpPeek').addEventListener('click', ()=> setSheet(true));
  // keep page content clear of the bottom sheet, and keep the sheet inside the visible area when the keyboard opens
  const comp = $('composer');
  const upd = ()=>{
    const narrow = matchMedia('(max-width:859px)').matches;
    document.documentElement.style.setProperty('--sheet-h', narrow ? (comp.offsetHeight + 'px') : '0px');
    const vv = window.visualViewport;
    document.documentElement.style.setProperty('--vvh', (vv ? vv.height : innerHeight) + 'px');
    if (vv && narrow) comp.style.bottom = Math.max(0, innerHeight - vv.height - vv.offsetTop) + 'px'; else comp.style.bottom = '';
  };
  if (window.ResizeObserver) new ResizeObserver(upd).observe(comp);
  if (window.visualViewport){ visualViewport.addEventListener('resize', upd); visualViewport.addEventListener('scroll', upd); }
  addEventListener('resize', upd); upd();
  renderTemplateSelect();
  renderComposer();
}
function renderTemplateSelect(){
  const s = $('cmpTplSelect');
  s.innerHTML = '';
  s.append(h('option', {value:''}, '＋ Insert template…'));
  cfg.templates.filter(t => t.active).forEach(t => s.append(h('option', {value:t.id}, t.name)));

const badge = (txt, cls) => h('span', {class:'badge ' + (cls || '')}, txt);
const PH_BUILTIN_AUTO = ['product_code','product_name','price','size','color'];
function placeholderStatus(key){
  const k = key.toLowerCase();
  if (k === 'customer_name') return 'typed per chat';
  if (PH_BUILTIN_AUTO.includes(k)) return 'filled from the open product' + (k === 'price' ? ' (fresh stock only)' : '');
  const v = (cfg.settings.values || {})[k];
  return (v && v.trim()) ? 'verified value set in Settings' : 'NO VALUE SET — will be flagged for manual entry';
}
function keysIn(text){ const s = new Set(); for (const m of String(text).matchAll(PH_RE)) s.add(m[1].toLowerCase()); return Array.from(s); }
function markedPreview(text){
  const out = []; let last = 0;
  for (const m of String(text).matchAll(PH_RE)){ out.push(text.slice(last, m.index), h('mark', null, m[0])); last = m.index + m[0].length; }
  out.push(text.slice(last));
  return out;
}

function previewEntry(e){
  const body = h('div', {class:'stack'});

async function duplicateEntry(e){

function renderQAList(){
  const box = $('qaList');
  if (!box) return;
  const status = qaState.status || (adminMode ? 'all' : 'active');
  const q = normalizeText(qaState.q);
  box.innerHTML = '';
  let total = 0;
  const cats = cfg.categories.filter(c => !qaState.cat || c.id === qaState.cat);
  const orphan = cfg.entries.filter(e => !catById(e.categoryId));

const bc = { current:null, updatedAtMs:null, loaded:false, loading:false, err:'', image:null, imageName:'', publishing:false, compressing:false };
async function loadBroadcast(){
  bc.loading = true; bc.err = '';

  }catch(e){ bc.err = fbErrorText(e); }
  bc.loading = false;

function compressImageFileOnce(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, hh = img.height;
        if (w > maxDim || hh > maxDim){
          if (w >= hh){ hh = Math.round(hh * maxDim / w); w = maxDim; } else { w = Math.round(w * maxDim / hh); hh = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = hh;
        canvas.getContext('2d').drawImage(img, 0, 0, w, hh);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=> reject(new Error('Could not read that image'));
      img.src = reader.result;
    };
    reader.onerror = ()=> reject(new Error('Could not read that file'));
    reader.readAsDataURL(file);
  });
}
async function compressImageToLimit(file, limitBytes){
  let maxDim = 900, quality = 0.75;
  for (let i = 0; i < 6; i++){
    const dataUrl = await compressImageFileOnce(file, maxDim, quality);
    if (Math.round(dataUrl.length * 0.75) <= limitBytes) return dataUrl;
    if (quality > 0.4) quality -= 0.15; else { maxDim = Math.round(maxDim * 0.7); quality = 0.6; }
  }
  return compressImageFileOnce(file, 300, 0.4);
}
async function handleBroadcastImage(file){
  if (!file || !(file.type || '').startsWith('image/')){ toast('That file is not an image.', 'error'); return; }
  if (file.size > 25 * 1024 * 1024){ toast('That image is too large (over 25 MB). Choose a smaller one.', 'error'); return; }
  bc.compressing = true; renderBroadcasts(true);
  try{
    bc.image = await compressImageToLimit(file, 650000);
    bc.imageName = file.name || 'Pasted image';
  }catch(e){ toast(e.message || 'Could not read that image — try another.', 'error'); }
  bc.compressing = false; renderBroadcasts(true);
}
document.addEventListener('paste', (e)=>{
  if ($('sec-broadcasts').hidden) return;
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for (const it of items){
    if (it.type && it.type.indexOf('image/') === 0){ const f = it.getAsFile(); if (f){ handleBroadcastImage(f); e.preventDefault(); } break; }
  }
});

function csvCell(v){ const s = String(v == null ? '' : v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
