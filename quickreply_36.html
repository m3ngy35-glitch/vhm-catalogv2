/* =====================================================================
   Import (validate → preview → apply; never silently replaces)
   ===================================================================== */
function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(cell); cell = ''; if (row.some(x => x !== '')) rows.push(row); row = []; }
    else cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); if (row.some(x => x !== '')) rows.push(row); }
  return rows;
}
function parsedFromCSV(text){
  const rows = parseCSV(text), errors = [];
  if (rows.length < 2) return { errors:['The CSV has no data rows.'], entries:[] };
  const head = rows[0].map(s => s.trim().toLowerCase());
  const col = n => head.indexOf(n);
  if (col('title') < 0 || col('category') < 0) return { errors:['The CSV needs at least “category” and “title” columns (export a CSV first to see the format).'], entries:[] };
  const ansCols = head.map((n, i) => n.startsWith('answer_') ? [n.slice(7), i] : null).filter(Boolean);
  if (!ansCols.length) return { errors:['The CSV needs at least one “answer_<language code>” column, e.g. answer_km.'], entries:[] };
  const cats = [], entries = [];
  const get = (r, n) => col(n) >= 0 ? (r[col(n)] || '') : '';
  rows.slice(1).forEach((r, i) => {
    const catName = get(r, 'category').trim();
    let cat = cfg.categories.find(c => normalizeText(c.name) === normalizeText(catName)) || cats.find(c => normalizeText(c.name) === normalizeText(catName));
    if (!cat && catName){ cat = { id:uid('cat'), name:catName, productSpecific:false }; cats.push(cat); }
    const answers = {}; ansCols.forEach(([code, idx]) => { if ((r[idx] || '').trim()) answers[code] = r[idx]; });
    const split = s => s.split('|').map(x => x.trim()).filter(Boolean);
    entries.push({ id:get(r, 'id').trim(), categoryId:cat ? cat.id : '', title:get(r, 'title').trim(), phrasings:split(get(r, 'phrasings')), keywords:split(get(r, 'keywords')),
      answers, note:get(r, 'note'), active:!/^(no|false|0)$/i.test(get(r, 'active').trim() || 'yes'), priority:Number(get(r, 'priority')) || 0,
      insertMode:get(r, 'insert_mode') === 'append' ? 'append' : 'replace', expiresOn:get(r, 'expires_on').trim(), eligibleCodes:split(get(r, 'eligible_codes')),
      createdAt:Date.parse(get(r, 'created_at')) || 0, updatedAt:Date.parse(get(r, 'updated_at')) || 0, __row:i + 2 });
  });
  return { errors, entries, categories:cats };
}
async function handleImportFile(file){
  if (!adminMode){ toast('Turn on admin editing in Settings to import.', 'warn'); return; }
  if (!file) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (!['json','csv'].includes(ext)){ toast('Only .json or .csv files can be imported.', 'error'); return; }
  if (file.size > 3 * 1024 * 1024){ toast('That file is over 3 MB — too large to import.', 'error'); return; }
  let text;
  try{ text = await file.text(); }catch(e){ toast('Could not read that file.', 'error'); return; }
  let parsed;
  if (ext === 'json'){
    let j;
    try{ j = JSON.parse(text); }catch(e){ toast('That file is not valid JSON: ' + e.message, 'error', 8000); return; }
    if (!j || typeof j !== 'object' || (j.format !== 'vhm-quickreply-library' && !Array.isArray(j.entries))){ toast('This does not look like a VH MEN Q&A library export (missing format/entries).', 'error', 8000); return; }
    if (j.version && Number(j.version) > 1){ toast('This file was made by a newer version (v' + j.version + ') and cannot be imported safely.', 'error', 8000); return; }
    parsed = { errors:[], languages:asArr(j.languages), categories:asArr(j.categories), entries:asArr(j.entries), templates:asArr(j.templates), workflows:asArr(j.workflows) };
  } else parsed = parsedFromCSV(text);
  showImportPreview(planImport(parsed), file.name);
}
function stableStringify(o){
  if (Array.isArray(o)) return '[' + o.map(stableStringify).join(',') + ']';
  if (o && typeof o === 'object') return '{' + Object.keys(o).sort().map(k => JSON.stringify(k) + ':' + stableStringify(o[k])).join(',') + '}';
  return JSON.stringify(o);
}
function sameJSON(a, b){ const strip = o => { const c = clone(o); delete c.updatedAt; delete c.createdAt; delete c.__row; return stableStringify(c); }; return strip(a) === strip(b); }
function planImport(p){
  const rows = [], errors = (p.errors || []).slice();
  const push = (kind, item, label, status, msg) => {
    const opts = { new:['add','skip'], same:['skip'], conflict:['skip','replace','copy'], dup:['skip','copy'], invalid:['skip'] }[status];
    rows.push({ kind, item, label, status, msg:msg || '', action: status === 'new' ? 'add' : 'skip', opts });
  };
  const catIdsInImport = new Set();
  asArr(p.categories).forEach((c, i)=>{
    if (!c || !str(c.id).trim() || !str(c.name).trim()){ push('category', c, '(category #' + (i + 1) + ')', 'invalid', 'needs an id and a name'); return; }
    catIdsInImport.add(c.id);
    const ex = cfg.categories.find(x => x.id === c.id);
    if (ex) { if (normalizeText(ex.name) === normalizeText(c.name)) push('category', c, c.name, 'same', 'already exists'); else push('category', c, c.name, 'conflict', 'same id as “' + ex.name + '” but a different name'); return; }
    const dn = cfg.categories.find(x => normalizeText(x.name) === normalizeText(c.name));
    if (dn) push('category', c, c.name, 'dup', 'a category with this name already exists — its answers will go there if you skip'); else push('category', c, c.name, 'new');
  });
  asArr(p.templates).forEach((t, i)=>{
    if (!t || !str(t.text).trim()){ push('template', t, '(template #' + (i + 1) + ')', 'invalid', 'needs text'); return; }
    const label = str(t.name) || t.text.slice(0, 30);
    const id = str(t.id);
    const ex = id && cfg.templates.find(x => x.id === id);
    if (ex){ if (sameJSON(ex, t)) push('template', t, label, 'same', 'already exists'); else push('template', t, label, 'conflict', 'same id as existing template “' + ex.name + '”'); return; }
    if (cfg.templates.some(x => normalizeText(x.text) === normalizeText(t.text))) push('template', t, label, 'dup', 'a template with identical text exists'); else push('template', t, label, 'new');
  });
  const newEntryIds = new Set();
  asArr(p.entries).forEach((e, i)=>{
    const label = (e && e.title ? str(e.title) : '(entry #' + (i + 1) + (e && e.__row ? ', CSV row ' + e.__row : '') + ')');
    if (!e || !str(e.title).trim()){ push('answer', e, label, 'invalid', 'missing title'); return; }
    const answers = e.answers && typeof e.answers === 'object' ? e.answers : {};
    if (!Object.values(answers).some(v => str(v).trim())){ push('answer', e, label, 'invalid', 'no answer text in any language'); return; }
    if (!str(e.categoryId).trim() || !(cfg.categories.some(c => c.id === e.categoryId) || catIdsInImport.has(e.categoryId))){ push('answer', e, label, 'invalid', 'category “' + str(e.categoryId) + '” not found (and not in the import)'); return; }
    if (e.expiresOn && !/^\d{4}-\d{2}-\d{2}$/.test(str(e.expiresOn))){ push('answer', e, label, 'invalid', 'expires_on must be YYYY-MM-DD'); return; }
    const id = str(e.id).trim();
    const ex = id && cfg.entries.find(x => x.id === id);
    if (ex){ if (sameJSON(ex, normEntry(Object.assign({}, e, {id})))) push('answer', e, label, 'same', 'already exists, identical'); else push('answer', e, label, 'conflict', 'same id as existing answer “' + ex.title + '” — content differs'); return; }
    const dn = cfg.entries.find(x => x.categoryId === e.categoryId && normalizeText(x.title) === normalizeText(e.title));
    if (dn) push('answer', e, label, 'dup', 'same title already in this category'); else push('answer', e, label, 'new');
    if (id) newEntryIds.add(id);
  });
  asArr(p.workflows).forEach((w, i)=>{
    if (!w || !str(w.name).trim()){ push('workflow', w, '(workflow #' + (i + 1) + ')', 'invalid', 'needs a name'); return; }
    const id = str(w.id), ex = id && cfg.workflows.find(x => x.id === id);
    if (ex){ if (sameJSON(ex, w)) push('workflow', w, w.name, 'same', 'already exists'); else push('workflow', w, w.name, 'conflict', 'same id as existing workflow “' + ex.name + '”'); return; }
    if (cfg.workflows.some(x => normalizeText(x.name) === normalizeText(w.name))) push('workflow', w, w.name, 'dup', 'a workflow with this name exists'); else push('workflow', w, w.name, 'new');
  });
  if (!rows.length) errors.push('Nothing to import was found in this file.');
  return { rows, errors, languages:asArr(p.languages), categories:asArr(p.categories) };
}

async function applyImport(plan){
  const now = Date.now();
  let n = { cat:0, tpl:0, ans:0, wf:0, repl:0 };
  const ok = await mutateConfig(c => {
    const catMap = {}, tplMap = {};
    const ensureLang = code => { if (!c.settings.languages.some(l => l.code === code)) c.settings.languages.push({ code, label: (plan.languages.find(l => l && l.code === code) || {}).label || code }); };
    // categories
    plan.rows.filter(r => r.kind === 'category' && r.status !== 'invalid').forEach(r => {
      const it = r.item;
      const ex = c.categories.find(x => x.id === it.id);
      if (r.action === 'add'){ c.categories.push({id:it.id, name:str(it.name).trim(), productSpecific:!!it.productSpecific}); catMap[it.id] = it.id; n.cat++; }
      else if (r.action === 'replace' && ex){ ex.name = str(it.name).trim(); ex.productSpecific = !!it.productSpecific; catMap[it.id] = ex.id; n.cat++; n.repl++; }
      else if (r.action === 'copy'){ const id = uid('cat'); c.categories.push({id, name:str(it.name).trim() + (r.status === 'conflict' ? ' (copy)' : ''), productSpecific:!!it.productSpecific}); catMap[it.id] = id; n.cat++; }
      else { const byName = c.categories.find(x => normalizeText(x.name) === normalizeText(it.name)); if (ex) catMap[it.id] = ex.id; else if (byName) catMap[it.id] = byName.id; }
    });
    const resolveCat = id => {
      if (catMap[id]) return catMap[id];
      if (c.categories.some(x => x.id === id)) return id;
      const def = plan.categories.find(x => x && x.id === id);
      if (def){ c.categories.push({id, name:str(def.name).trim(), productSpecific:!!def.productSpecific}); catMap[id] = id; n.cat++; return id; }
      return id;
    };
    // templates
    plan.rows.filter(r => r.kind === 'template' && r.status !== 'invalid').forEach(r => {
      const t = r.item, id0 = str(t.id);
      const base = { name:str(t.name) || 'Template', kind:str(t.kind) || 'general', text:str(t.text), active:t.active !== false };
      if (r.action === 'add'){ const id = id0 || uid('tpl'); c.templates.push(Object.assign({id, createdAt:Number(t.createdAt) || now, updatedAt:now}, base)); tplMap[id0] = id; n.tpl++; }
      else if (r.action === 'replace'){ const i = c.templates.findIndex(x => x.id === id0); if (i >= 0){ c.templates[i] = Object.assign({id:id0, createdAt:c.templates[i].createdAt, updatedAt:now}, base); tplMap[id0] = id0; n.tpl++; n.repl++; } }
      else if (r.action === 'copy'){ const id = uid('tpl'); c.templates.push(Object.assign({id, createdAt:now, updatedAt:now}, base, {name:base.name + ' (copy)'})); tplMap[id0] = id; n.tpl++; }
      else if (id0 && c.templates.some(x => x.id === id0)) tplMap[id0] = id0;
    });
    // answers
    plan.rows.filter(r => r.kind === 'answer' && r.status !== 'invalid').forEach(r => {
      if (r.action === 'skip') return;
      const e = r.item, id0 = str(e.id).trim();
      Object.keys(e.answers || {}).forEach(ensureLang);
      const mk = (id, extra) => normEntry(Object.assign({}, e, { id, categoryId:resolveCat(e.categoryId), createdAt:Number(e.createdAt) || now, updatedAt:now }, extra || {}));
      if (r.action === 'add'){ c.entries.push(mk(id0 || uid('qa'))); n.ans++; }
      else if (r.action === 'replace'){ const i = c.entries.findIndex(x => x.id === id0); if (i >= 0){ c.entries[i] = mk(id0, { createdAt:c.entries[i].createdAt }); n.ans++; n.repl++; } }
      else if (r.action === 'copy'){ c.entries.push(mk(uid('qa'), { title:str(e.title).trim() + (r.status === 'conflict' ? ' (copy)' : '') })); n.ans++; }
    });
    // workflows (references mapped; unknown references dropped)
    plan.rows.filter(r => r.kind === 'workflow' && r.status !== 'invalid').forEach(r => {
      if (r.action === 'skip') return;
      const w = r.item, id0 = str(w.id);
      const nu = { id:id0 || uid('wf'), name:str(w.name).trim(), lang:str(w.lang), escalation:str(w.escalation),
        categoryIds:asArr(w.categoryIds).map(id => catMap[id] || id).filter(id => c.categories.some(x => x.id === id)),
        templateIds:asArr(w.templateIds).map(id => tplMap[id] || id).filter(id => c.templates.some(x => x.id === id)),
        rules:{ greeting:!!(w.rules && w.rules.greeting), productActions:!!(w.rules && w.rules.productActions) } };
      if (r.action === 'add'){ c.workflows.push(nu); n.wf++; }
      else if (r.action === 'replace'){ const i = c.workflows.findIndex(x => x.id === id0); if (i >= 0){ c.workflows[i] = nu; n.wf++; n.repl++; } }
      else if (r.action === 'copy'){ nu.id = uid('wf'); nu.name += ' (copy)'; c.workflows.push(nu); n.wf++; }
    });
  });
  return ok ? (n.ans + ' answer(s), ' + n.cat + ' categor' + (n.cat === 1 ? 'y' : 'ies') + ', ' + n.tpl + ' template(s), ' + n.wf + ' workflow(s)' + (n.repl ? ', ' + n.repl + ' replaced' : '')) : null;
}

/* =====================================================================
   Universal search, navigation, status chips, remote trigger, boot
   ===================================================================== */
const SECTIONS = ['products','quick','qa','templates','broadcasts','settings'];
function renderSection(id){
  ({ products:renderProducts, quick:renderQuick, qa:renderQA, templates:renderTemplates, broadcasts:()=>renderBroadcasts(), settings:renderSettings })[id]();
}
function showSection(id){
  if (!SECTIONS.includes(id)) id = 'products';
  SECTIONS.forEach(s => { $('sec-' + s).hidden = s !== id; });
  document.querySelectorAll('#nav button').forEach(b => { if (b.dataset.sec === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (prefs.section !== id){ prefs.section = id; savePrefs(); }
  renderSection(id);
  if (id === 'broadcasts' && !bc.loaded && !bc.loading) loadBroadcast();
}
function currentSection(){ return SECTIONS.find(s => !$('sec-' + s).hidden) || 'products'; }
function rerenderAll(){
  renderStaffSelect(); renderStatus(); renderTemplateSelect();
  renderSection(currentSection());
  renderComposer();
}
function onConfigChanged(changed){
  renderStaffSelect(); renderStatus(); renderTemplateSelect();
  if (cfg.settings.defaultUpsell && !$('cmpUpsell').value) $('cmpUpsell').value = cfg.settings.defaultUpsell;
  if (!changed){ return; }
  const sec = currentSection();
  const ae = document.activeElement;
  const typing = ae && ['INPUT','TEXTAREA','SELECT'].includes(ae.tagName) && $('sec-' + sec).contains(ae) && ae.id !== 'search';
  if (typing && (sec === 'settings')) { toast('Shared settings were updated by someone else. Finish your edit, then reopen Settings to see the latest.', 'warn', 7000); }
  else renderSection(sec);
  if (sec !== 'quick') renderQuick();
  renderComposer();
}

/* ---------- status chips (only verifiable facts) ---------- */
function connText(){
  switch (conn.state){
    case 'ok': return { cls:'ok', text:'Firebase OK' + (conn.okAt ? ' · ' + fmtTime(conn.okAt) : '') };
    case 'cache': return { cls:'warn', text:'Showing cached data (not confirmed live)' };
    case 'offline': return { cls:'bad', text:'Offline — no connection' };
    case 'error': return { cls:'bad', text:'Firebase error: ' + (conn.err || 'unknown') };
    default: return { cls:'', text:'Connecting…' };
  }
}
function renderStatus(){
  const box = $('statusChips');
  if (!box) return;
  const c = connText();
  box.innerHTML = '';
  if (c.cls && c.cls !== 'ok') box.append(h('span', {class:'chip ' + c.cls, title:'Result of the last Firebase read/write'}, '⚠ ' + c.text));
  if (catalogState.status === 'error') box.append(h('span', {class:'chip bad'}, '⚠ Catalog not loaded'));
  renderStockBar();
}
function renderStaffSelect(){
  const sel = $('staffSelect');
  const cur = getStaffName();
  sel.innerHTML = '';
  sel.append(h('option', {value:''}, '— select —'));
  const names = cfg.settings.staff.slice();
  if (cur && !names.includes(cur)) names.push(cur);
  names.forEach(n => sel.append(h('option', {value:n, selected:n === cur}, n + (cfg.settings.staff.includes(n) ? '' : ' (not in list)'))));
  sel.value = cur;
}

/* ---------- universal search ---------- */
const S = { items:[], active:-1, timer:0 };
function snippet(t, n){ t = String(t || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n) + '…' : t; }
function runSearch(raw){
  const q = normalizeText(raw), qc = normCode(raw);
  const tokens = q.split(' ').filter(Boolean);
  if (!tokens.length) return [];
  const res = [];
  // 1. product-specific data first
  const codes = new Map();
  PRODUCTS.forEach(p => { if (p && p.code) codes.set(normCode(p.code), { code:p.code, name:p.name || '', nameKh:p.nameKh || '', cat:true, stock:false }); });
  stock.codes.forEach((v, k) => { const n = normCode(k), ex = codes.get(n); if (ex) ex.stock = true; else codes.set(n, { code:k, name:'', nameKh:'', cat:false, stock:true }); });
  codes.forEach((p, n) => {
    let s = 0;
    if (n === qc) s = 100; else if (n.startsWith(qc)) s = 70; else if (qc.length >= 2 && n.includes(qc)) s = 50;
    else { const hay = normalizeText(p.name + ' ' + p.nameKh); if (hay && tokens.every(t => hay.includes(t))) s = 35; }
    if (!s) return;
    res.push({ type:'product', score:s + (p.stock ? 5 : 0), code:p.code, exact:n === qc, title:p.code + (p.name || p.nameKh ? ' — ' + (p.name || p.nameKh) : ''),
      sub: p.stock ? 'In the loaded stock snapshot' + (p.cat ? ' and the catalog' : ' (not in catalog)') : 'Catalog only — no stock data loaded; verify in Vrich', badges: [p.cat ? 'product' : null, p.stock ? 'stock' : null].filter(Boolean) });
  });
  // 2-3. saved answers: exact → phrasing/keyword → text
  cfg.entries.filter(e => e.active).forEach(e => {
    const title = normalizeText(e.title), phr = e.phrasings.map(normalizeText), kw = e.keywords.map(normalizeText);
    let s = 0;
    if (title === q) s = 80; else if (phr.includes(q)) s = 78; else if (kw.includes(q)) s = 65;
    else if (tokens.every(t => title.includes(t))) s = 50;
    else if (phr.some(p => tokens.every(t => p.includes(t)))) s = 45;
    else if (kw.some(k => tokens.every(t => k.includes(t)))) s = 40;
    else if (tokens.every(t => normalizeText(Object.values(e.answers).join(' ')).includes(t))) s = 15;
    if (!s) return;
    const cat = catById(e.categoryId);
    res.push({ type:'qa', score:s + Math.min(9, e.priority / 10), entry:e, title:e.title, sub:(cat ? cat.name + ' · ' : '') + snippet(entryAnswer(e).text, 90), badges:['qa'] });
  });
  cfg.templates.filter(t => t.active).forEach(t => {
    const n = normalizeText(t.name), tx = normalizeText(t.text);
    let s = 0;
    if (tokens.every(k => n.includes(k))) s = 35; else if (tokens.every(k => tx.includes(k))) s = 15;
    if (s) res.push({ type:'template', score:s, tpl:t, title:t.name, sub:snippet(t.text, 90), badges:['template'] });
  });
  // 4. related categories
  cfg.categories.forEach(c => { if (tokens.every(t => normalizeText(c.name).includes(t))) res.push({ type:'category', score:20, cat:c, title:c.name, sub:cfg.entries.filter(e => e.categoryId === c.id && e.active).length + ' saved answers', badges:['category'] }); });
  return res.sort((a, b) => b.score - a.score).slice(0, 30);
}
function renderResults(raw){
  const box = $('results'), inp = $('search');
  const q = (raw || '').trim();
  if (!q){ closeResults(); return; }
  S.items = runSearch(q); S.active = -1; S.queryRendered = q;
  box.innerHTML = '';
  if (!S.items.length){
    box.append(h('div', {class:'res-empty'}, 'No match for “' + q + '” ',
      h('div', {style:'margin-top:6px'}, h('button', {type:'button', class:'btn sm', onclick:()=>{ closeResults(); $('composer').classList.add('open'); setSheet(true); $('cmpText').focus(); }}, 'Write manually'), ' ',
        (activeWorkflow() && activeWorkflow().escalation) ? h('span', {class:'small'}, '↗ ' + activeWorkflow().escalation) : null)));
  } else {
    S.items.forEach((it, i) => box.append(h('button', {type:'button', class:'res', role:'option', id:'res-' + i, 'aria-selected':'false', onclick:()=> pickResult(it)},
      h('span', null, it.badges.map(b => h('span', {class:'badge ' + b, style:'margin-right:4px'}, { product:'Product', stock:'Stock', qa:'Q&A', template:'Template', category:'Category' }[b]))),
      h('span', {class:'grow'}, h('div', {class:'t kh'}, it.title), h('div', {class:'s kh'}, it.sub)))));
  }
  box.hidden = false; inp.setAttribute('aria-expanded', 'true');
}
function closeResults(){ $('results').hidden = true; $('search').setAttribute('aria-expanded', 'false'); $('search').removeAttribute('aria-activedescendant'); S.active = -1; }
function setActive(i){
  const nodes = $('results').querySelectorAll('.res');
  if (!nodes.length) return;
  S.active = (i + nodes.length) % nodes.length;
  nodes.forEach((n, k) => n.setAttribute('aria-selected', k === S.active ? 'true' : 'false'));
  nodes[S.active].scrollIntoView({block:'nearest'});
  $('search').setAttribute('aria-activedescendant', 'res-' + S.active);
}
function pickResult(it){
  closeResults();
  if (it.type === 'product') openProduct(it.code);
  else if (it.type === 'qa'){ useEntry(it.entry, 'auto'); toast('Answer prepared in the reply box — review it, then copy.', 'ok'); }
  else if (it.type === 'template'){ useTemplate(it.tpl, 'auto'); toast('Template added to the reply box.', 'ok'); }
  else if (it.type === 'category'){ qaState.cat = it.cat.id; qaState.q = ''; showSection('qa'); }
}
function initSearch(){
  const inp = $('search');
  inp.addEventListener('input', ()=>{ clearTimeout(S.timer); S.timer = setTimeout(()=> renderResults(inp.value), 90); });
  inp.addEventListener('focus', ()=>{ if (inp.value.trim()) renderResults(inp.value); });
  inp.addEventListener('keydown', (e)=>{
    if (e.key === 'ArrowDown'){ e.preventDefault(); if ($('results').hidden) renderResults(inp.value); setActive(S.active + 1); }
    else if (e.key === 'ArrowUp'){ e.preventDefault(); setActive(S.active - 1); }
    else if (e.key === 'Escape'){ closeResults(); }
    else if (e.key === 'Enter'){
      e.preventDefault();
      clearTimeout(S.timer);
      if ($('results').hidden || !S.items.length || inp.value.trim() !== (S.queryRendered || inp.value.trim())) renderResults(inp.value);
      if (S.active >= 0) pickResult(S.items[S.active]);
      else {
        const exact = S.items.filter(i => i.type === 'product' && i.exact);
        if (exact.length === 1 && S.items.filter(i => i.score >= 70).length === 1) pickResult(exact[0]);   // single unambiguous code
        // otherwise: show the choices, never pick silently
      }
    }
  });
  document.addEventListener('click', (e)=>{ if (!e.target.closest('.searchbox')) closeResults(); });
  document.addEventListener('keydown', (e)=>{
    if (e.key === '/' && !['INPUT','TEXTAREA','SELECT'].includes((document.activeElement || {}).tagName) && !dlg.open){ e.preventDefault(); inp.focus(); inp.select(); }
  });
}

/* ---------- remote trigger (existing bookmarklet hook, behaviour preserved: generate, copy, relay) ---------- */
async function applyQuickReplyAction(params){
  try{
    const action = params.get('action');
    if (!action) return;
    let ok = false;
    if (action === 'hello'){ const g = cfg.templates.find(t => t.id === cfg.settings.defaultGreetingId && t.active) || cfg.templates.find(t => t.active); if (g){ useTemplate(g, 'replace'); ok = true; } }
    else if (action === 'howmany') ok = replyHowMany();
    else if (action === 'size') ok = replySize((params.get('size') || '').toUpperCase());
    else if (action === 'color') ok = replyColorQuery((params.get('q') || '').toLowerCase());
    else if (action === 'fit') ok = await runFit(parseFloat(params.get('kg') || ''), (params.get('cm') || '').trim());
    if (ok){ await copyReply(); }
  }catch(e){ console.error('Quick reply remote trigger failed', e); }
}

/* ---------- boot ---------- */
function boot(){
  const imp = h('input', {type:'file', id:'importFile', accept:'.json,.csv', hidden:true, onchange:(e)=>{ const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) handleImportFile(f); }});
  document.body.append(imp);
  document.querySelectorAll('#nav button').forEach(b => b.addEventListener('click', ()=> showSection(b.dataset.sec)));
  $('btnSettings').addEventListener('click', ()=> showSection('settings'));
  $('staffSelect').addEventListener('change', (e)=>{ setStaffName(e.target.value); relayState.kind = 'idle'; relayState.msg = ''; renderStatus(); if (currentSection() === 'products') renderProducts(); });
  addEventListener('online', ()=>{ renderStatus(); });
  addEventListener('focus', ()=> autoLoadClipboardStock());
  addEventListener('offline', ()=>{ setConn('offline'); });
  document.addEventListener('visibilitychange', ()=>{ if (!document.hidden){ renderStatus(); renderComposer('light'); autoLoadClipboardStock(); } });
  const ud = cfg.settings.defaultUpsell; if (ud) $('cmpUpsell').value = ud;
  initSearch(); initComposer();
  renderStaffSelect(); renderStatus();
  subscribeConfig(); loadCatalog();
  showSection(SECTIONS.includes(prefs.section) ? prefs.section : 'products');
  setInterval(()=>{ renderStatus(); renderComposer('light'); }, 30000);
  if (location.hash){
    const hp = new URLSearchParams(location.hash.slice(1));
    setTimeout(()=> applyQuickReplyAction(hp), 600);
  }
  addEventListener('message', (e)=>{
    if (!e.data || e.data.source !== 'vhmQuickReplyTrigger') return;
    applyQuickReplyAction(new URLSearchParams(e.data.query || ''));
  });
}
boot();
