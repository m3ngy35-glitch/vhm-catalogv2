<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VHM Thank-you Pop-ups</title>
<!--
  VHM thank-you pop-ups — its own OBS Browser Source, so you can place it anywhere.
  Suggested OBS size: 1080 x 1920, same as VHM Overlay (pop-ups sit bottom-left, inside what phones show).
  Look C: the buyer's comment in a light Facebook-style bubble + green "បានទទួល Order · អរគុណបង" stamp.
  Data: kv/live_overlay_thanks  ← new Vrich orders, sent by the 📺 VHM Overlay bookmarklet's auto thank-you
        kv/live_overlay_settings ← pops: true/false (host screen switch)
  Options: ?align=left|center|right   ?demo=1 (sample pop-ups, no database)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&family=Noto+Sans+Khmer:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  #box { position: absolute; bottom: 0; left: 0; transform-origin: 0 100%; width: 540px; padding: 0 56px 100px; /* 100 = above Facebook's comment bar when the source is full frame */ box-sizing: border-box;
         display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
         font-family: Roboto, 'Noto Sans Khmer', -apple-system, 'Helvetica Neue', Arial, sans-serif; color: #fff; }
  #box.center { align-items: center; } #box.right { align-items: flex-end; }
  /* look C: the buyer's own comment, light Facebook bubble, with a green "order received" stamp */
  .t { display: flex; gap: 8px; align-items: flex-start; max-width: 100%; animation: popIn .3s cubic-bezier(.2,1.3,.4,1) both; }
  .t.out { animation: popOut .22s ease-in forwards; }
  .av { flex: none; width: 34px; height: 34px; border-radius: 17px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .bub { min-width: 0; background: rgba(255,255,255,.95); color: #050505; border-radius: 16px; padding: 7px 12px 8px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  .who { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
  .say { font-size: 16px; font-weight: 500; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
  .stamp { display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; background: #E6F4EA; color: #137333; border-radius: 999px; padding: 2px 9px 2px 6px; font-size: 13px; font-weight: 700; white-space: nowrap; animation: stamp .35s cubic-bezier(.2,1.6,.4,1) .45s both; }
  .stamp i { width: 15px; height: 15px; border-radius: 8px; background: #1E8E3E; display: inline-flex; align-items: center; justify-content: center; }
  @keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes popOut { to { opacity: 0; transform: translateX(-24px); } }
  @keyframes stamp { from { opacity: 0; transform: scale(.4) rotate(-8deg); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="box"></div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
(function () {
  var HOLD = 2800, GAP = 300, MAX_WAITING = 8;
  var params = new URLSearchParams(location.search);
  var box = document.getElementById('box');
  var align = params.get('align'); if (align === 'center' || align === 'right') box.classList.add(align);

  /* same size as the cards overlay: 540 design units across the source width */
  function fit() {
    var k = window.innerWidth / 540;
    box.style.transform = 'scale(' + k + ')';
    if (align === 'right') { box.style.left = 'auto'; box.style.right = '0'; box.style.transformOrigin = '100% 100%'; }
    if (align === 'center') { box.style.left = '50%'; box.style.marginLeft = '-270px'; box.style.transformOrigin = '50% 100%'; }
  }
  window.addEventListener('resize', fit); fit();

  var queue = [], playing = false, shown = {}, popsOn = true;
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  var COLORS = ['#E8710A', '#1A73E8', '#9334E6', '#188038', '#D93025', '#C5221F', '#12858A', '#B06000'];
  function colorFor(name) { var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0; return COLORS[h % COLORS.length]; }
  function show(o) {
    var t = el('div', 't');
    var name = String(o.name || '').trim();
    var av = el('div', 'av', Array.from(name)[0] || '•'); av.style.background = colorFor(name);
    var bub = el('div', 'bub');
    bub.appendChild(el('div', 'who', name));
    var said = o.comment || (o.code + (o.c ? ' ' + o.c : '') + (o.z && o.z !== '—' ? ' ' + o.z : ''));
    bub.appendChild(el('div', 'say', said));
    var st = el('div', 'stamp');
    st.innerHTML = '<i><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></i>';
    st.appendChild(document.createTextNode('បានទទួល Order · អរគុណបង'));
    bub.appendChild(st);
    t.appendChild(av); t.appendChild(bub); box.appendChild(t);
    setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); next(); }, 230); }, HOLD);
  }
  function next() {
    if (!queue.length) { playing = false; return; }
    playing = true;
    var o = queue.shift();
    setTimeout(function () { if (popsOn) show(o); else next(); }, GAP);
  }
  function add(o) {
    if (!o || !o.id || shown[o.id] || !o.name) return;
    shown[o.id] = 1;
    if (!popsOn) return;
    queue.push(o);
    if (queue.length > MAX_WAITING) queue.splice(0, queue.length - MAX_WAITING); /* a big burst: keep the newest */
    if (!playing) next();
  }

  if (params.get('demo') === '1') {
    var S = [['Dara Sok', 'E100 កាហ្វេ 3XL', 'E100', 'កាហ្វេ', '3XL'], ['សុខា ចាន់', 'E100 ខ្មៅ 2XL បង', 'E100', 'ខ្មៅ', '2XL'], ['Vanna Kim', '', 'LH', '', '32']], n = 0;
    function demo() { var x = S[n % S.length]; add({ id: 'demo' + (n++), name: x[0], comment: x[1], code: x[2], c: x[3], z: x[4] }); }
    demo(); setTimeout(demo, 300); setInterval(demo, 4000);
    return;
  }

  firebase.initializeApp({
    apiKey: 'AIzaSyDDQp5_gvuRdX0flKQ3gm3zXJM_SXWUJSE', authDomain: 'vhm-catalog.firebaseapp.com', projectId: 'vhm-catalog',
    storageBucket: 'vhm-catalog.firebasestorage.app', messagingSenderId: '892196724857', appId: '1:892196724857:web:8ed3f5f056284b63aa34a8'
  });
  var kvc = firebase.firestore().collection('kv');
  function parseData(snap) {
    if (!snap.exists) return null; var v = snap.data().data;
    if (v == null || v === '') return null;
    if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return null; } }
    return v;
  }
  var startedAt = new Date(Date.now() - 30000).toISOString(); /* only orders from now on (30 s grace) */
  kvc.doc('live_overlay_settings').onSnapshot(function (snap) {
    var d = parseData(snap) || {};
    popsOn = d.pops !== false;
    if (!popsOn) { queue = []; box.innerHTML = ''; }
  }, function () {});
  kvc.doc('live_overlay_thanks').onSnapshot(function (snap) {
    var d = parseData(snap); if (!d || !d.items) return;
    d.items.forEach(function (o) { if (String(o.at || '') >= startedAt) add(o); else shown[o.id] = 1; });
  }, function (err) { console.warn('Thank-you listener failed — pop-ups paused', err); });
})();
</script>
</body>
</html>
